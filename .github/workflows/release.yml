name: release

# Builds the client for each platform ON that platform.
#
# ⚠️ EVERY JOB RUNS THE BINARY BEFORE PACKAGING IT. A green build proves the code
# compiles and proves nothing about whether the program starts - the .NET client
# shipped a release that could not launch at all while every test passed
# (CARRYOVER.md section 8). `--selftest` walks the startup path and exits, and it
# runs under a timeout because a hang is a failure too.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  linux:
    # ⚠️ NATIVE RUNNER PER ARCHITECTURE. NO CROSS-COMPILATION, EVER.
    #
    # This is the standing rule for every target in this workflow. Cross-compiling Qt is
    # unpleasant, and PyInstaller cannot cross-compile AT ALL - there is no toolchain and
    # no trick, which is why the pusher would have blocked arm64 forever. GitHub added
    # arm64 standard runners for PRIVATE repositories on 01/29/2026 and they draw on the
    # same free minutes, so the problem is dissolved rather than solved.
    #
    # ⚠️ Private-repo arm64 runners get TWO vCPUs where public gets four. Expect a
    # noticeably longer wall clock, and do not read slowness as a hang.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64,   runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build \
            qt6-base-dev qt6-declarative-dev qt6-websockets-dev qt6-multimedia-dev \
            qml6-module-qtqml qml6-module-qtqml-workerscript \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-templates \
            qml6-module-qtquick-window qml6-module-qtquick-shapes \
            libasound2-dev libssl-dev
      - name: Build
        run: |
          cmake -S client -B client/build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build client/build
      - name: Test
        run: ctest --test-dir client/build --output-on-failure
      - name: Run the binary
        run: QT_QPA_PLATFORM=offscreen timeout 60 ./client/build/hamdeck-qml --selftest
      - name: Package
        run: cd client/build && cpack -G DEB
      # ⚠️ Verify the ARTIFACT, not the build: install the package and run what
      # it installed, from the path it installed to.
      - name: Install the package and run what it installed
        run: |
          sudo apt-get install -y -qq ./client/build/*.deb
          QT_QPA_PLATFORM=offscreen timeout 60 /usr/bin/hamdeck-qml --selftest
      # ⚠️ A RELEASE GATE, ADDED BECAUSE 0.1.2 SHIPPED A WINDOW NOBODY COULD
      # MOVE. Every check before it ran under the offscreen QPA - no window
      # manager, no decoration - so a title bar placed above the top of the
      # screen could not be seen. This runs a real WM and reads back where the
      # decorated frame landed. If it fails, no installer is produced.
      - name: Where does the window actually land
        run: |
          sudo apt-get install -y -qq xvfb openbox x11-utils xdotool
          export HAMDECK_CLIENT=/usr/bin/hamdeck-qml
          for s in 1024x600 1366x768 1920x1080 2560x1440; do
            ./tools/placement_check.sh $s fresh || exit 1
          done
          ./tools/placement_check.sh 1920x1080 saved-at-origin || exit 1
          ./tools/placement_check.sh 1920x1080 saved-offscreen || exit 1
          ./tools/placement_check.sh 1024x600  saved-at-origin || exit 1
      # ⚠️ The artifact name carries the architecture. Two matrix legs uploading to one
      # name is a race whose winner is arbitrary - you get one .deb, for whichever
      # architecture happened to finish last, with nothing anywhere saying so.
      - uses: actions/upload-artifact@v4
        with:
          # ⚠️ Block style, not `with: { ... }`. A ${{ }} expression inside a YAML FLOW
          # mapping makes the parser choke on the braces - the workflow is then invalid in
          # a way the editor shows but a quick eyeball does not.
          name: hamdeck-linux-deb-${{ matrix.arch }}
          path: client/build/*.deb

  windows:
    # ⚠️ THE ONE TARGET WHERE "NEVER CROSS-COMPILE" CANNOT FULLY HOLD.
    #
    # Qt's Windows arm64 kit is called win64_msvc2022_arm64_cross_compiled, and there is
    # no native-host alternative - Qt builds it that way. The runner IS native arm64, so
    # the compiler and the tests run natively, but the Qt kit itself is a cross build.
    # Recorded rather than papered over: the rule is a default, and this is its exception.
    #
    # ⚠️ arm64 is an OPTIMISATION here, not enablement. Windows on ARM runs the x64 build
    # under emulation already, so nothing is unreachable without this - which is also why
    # the arm64 leg does not fail the whole matrix.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64,   runner: windows-latest,  qtarch: win64_msvc2022_64 }
          - { arch: arm64, runner: windows-11-arm,  qtarch: win64_msvc2022_arm64_cross_compiled }
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          arch: ${{ matrix.qtarch }}
          version: '6.8.1'
          # ⚠️ NOT qtdeclarative. Qt Quick is part of the BASE install in Qt 6,
          # and naming it as an add-on makes aqt fail to parse the package XML -
          # which kills the whole step before a single line is compiled.
          modules: 'qtwebsockets qtmultimedia'
      - name: Build
        run: |
          cmake -S client -B client/build -DCMAKE_BUILD_TYPE=Release
          cmake --build client/build --config Release
      - name: Run the binary
        shell: pwsh
        run: |
          # ⚠️ On Windows this is the check that matters: a Qt app missing its
          # platform plugin exits silently with no window and no message.
          $p = Start-Process -FilePath "client\build\Release\hamdeck-qml.exe" `
               -ArgumentList "--selftest" -NoNewWindow -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "selftest failed: $($p.ExitCode)" }
      # ⚠️ A GREEN WINDOWS BUILD DOES NOT MEAN THE ICON IS IN THE BINARY.
      # CMake ignores a .rc silently when the RC language is not enabled, so
      # 0.1.12 shipped with the resource committed, referenced, and never once
      # compiled. This looks inside the exe for the artwork itself.
      - name: The icon is actually in the exe
        run: python tools/check_exe_icon.py client\build\Release\hamdeck-qml.exe packaging\icons\hamdeck-256.png
        shell: cmd

      - name: Stage the Qt runtime beside the binary
        shell: pwsh
        run: |
          mkdir packaging\deploy
          copy client\build\Release\hamdeck-qml.exe packaging\deploy\
          # windeployqt pulls in the platform plugin, the QML modules and the
          # Qt DLLs. Without --qmldir it misses the QML imports entirely and the
          # app launches to a blank window.
          windeployqt --qmldir client\qml --release packaging\deploy\hamdeck-qml.exe
      - name: Run it again from the staged directory
        shell: pwsh
        run: |
          # Proves the DEPLOYED tree works, not just the build tree - which is
          # where the platform-plugin failure actually shows up.
          $p = Start-Process -FilePath "packaging\deploy\hamdeck-qml.exe" `
               -ArgumentList "--selftest" -NoNewWindow -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "deployed selftest failed: $($p.ExitCode)" }
      # ⚠️ NO INSTALLER HERE ANY MORE. The client used to ship its own unsigned Inno
      # setup, which meant a second download, a second signature to arrange, and a second
      # SmartScreen reputation starting from zero - while every download of one did nothing
      # for the other. It is now packaged together with the pusher in one signed Velopack
      # package, so this job's job is to hand over a staged tree.
      - uses: actions/upload-artifact@v4
        with:
          name: hamdeck-client-deploy-${{ matrix.arch }}
          path: packaging/deploy/**

  pusher-windows:
    # ⚠️ ONE PACKAGE, TWO APPLICATIONS. This job now needs the Qt client's staged tree,
    # because both ship inside a single signed Velopack package: one download, one
    # signature, one update channel, and one SmartScreen reputation that both halves feed
    # instead of two starting from zero and neither getting anywhere.
    needs: [windows]
    # ⚠️ JOB LEVEL, NOT STEP LEVEL. A step's own `env:` is not in scope for that same
    # step's `if:` - the env context there resolves workflow- and job-level values only.
    # Defined on the step, the signing gate would read empty and the signing steps would
    # ALWAYS SKIP, shipping an unsigned installer while the log looked deliberate. That is
    # the exact failure this gate exists to prevent, so it is worth the odd placement.
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    # The Wavelog data pusher: a Python/Tk desktop app, frozen with PyInstaller.
    #
    # ⚠️ THE ORDER OF THESE STEPS IS THE POINT. Tests run before the freeze, and then
    # --selftest runs AGAINST THE FROZEN EXE - because the two failures this has to catch
    # happen at different stages. A logic bug fails the first; PyInstaller bundling an
    # empty package, or missing tkinter, only fails the second. A bundle that starts is
    # not a bundle that works.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Tests
        working-directory: pusher
        run: python -m unittest discover -s tests -v
      - name: Selftest, from source
        working-directory: pusher
        run: python -m hamdeck_pusher --selftest
      - name: Freeze
        working-directory: pusher
        # ⚠️ EVERY PATH INPUT HERE IS ABSOLUTE, AND THAT IS THE RULE, NOT A PREFERENCE.
        #
        # PyInstaller resolves --icon and --version-file relative to --specpath, NOT to the
        # working directory. Both were written relative and both broke, on separate days:
        #   --icon         ..\packaging\icons\hamdeck.ico  -> pusher\packaging\..\packaging\...
        #   --version-file packaging\version_info.txt       -> pusher\packaging\packaging\...
        # The second one landed AFTER the first was fixed, because the fix was applied to
        # the one flag that had failed rather than to the class of mistake.
        #
        # ⚠️ A LINUX FREEZE CANNOT CATCH EITHER. PyInstaller never opens the .ico or the
        # version resource when the output is an ELF binary, so a local dry run passes with
        # both paths wrong. A local freeze proves the bundle is not empty. It proves
        # nothing at all about Windows packaging inputs.
        run: |
          pip install pyinstaller velopack
          pyinstaller --noconfirm --clean --onedir --windowed ^
            --name hamdeck-pusher ^
            --icon "%GITHUB_WORKSPACE%\packaging\icons\hamdeck.ico" ^
            --paths . ^
            --version-file "%GITHUB_WORKSPACE%\pusher\packaging\version_info.txt" ^
            --distpath packaging\dist ^
            --workpath packaging\work ^
            --specpath packaging ^
            packaging\entry.py
        shell: cmd
      - name: Selftest, on the FROZEN exe
        working-directory: pusher
        shell: pwsh
        run: |
          # ⚠️ A --windowed exe has NO stdout, so the report goes to a file. Without this
          # a failing frozen build gives CI an exit code and nothing to act on - and that
          # is the one occasion the detail matters.
          $p = Start-Process -FilePath "packaging\dist\hamdeck-pusher\hamdeck-pusher.exe" `
               -ArgumentList "--selftest","--report","selftest.txt" -PassThru -Wait
          if (Test-Path selftest.txt) { Get-Content selftest.txt }
          if ($p.ExitCode -ne 0) { throw "frozen selftest failed: $($p.ExitCode)" }
      - name: The icon is actually in the exe
        working-directory: pusher
        run: python ..\tools\check_exe_icon.py packaging\dist\hamdeck-pusher\hamdeck-pusher.exe ..\packaging\icons\hamdeck-256.png
        shell: cmd

      # ⚠️ AND THE VERSION RESOURCE IS ACTUALLY IN THE EXE.
      #
      # Same reason the icon has its own check: a path handed to PyInstaller can be wrong
      # in a way that produces a perfectly good binary missing the thing you asked for.
      # --version-file pointed at the wrong path for a whole release and the only symptom
      # would have been an exe with no company or product name - which is precisely the
      # shape the Defender heuristic scores badly, i.e. the thing it was added to fix.
      - name: The version resource is actually in the exe
        shell: pwsh
        run: |
          $exe = "pusher\packaging\dist\hamdeck-pusher\hamdeck-pusher.exe"
          $vi = (Get-Item $exe).VersionInfo
          "ProductName : $($vi.ProductName)"
          "CompanyName : $($vi.CompanyName)"
          "FileVersion : $($vi.FileVersion)"
          if ($vi.ProductName -ne 'HamDeck Wavelog Pusher') { throw "version resource missing or wrong: ProductName='$($vi.ProductName)'" }
          if ([string]::IsNullOrWhiteSpace($vi.CompanyName)) { throw "version resource has no CompanyName" }
      - name: Bring in the Qt client
        uses: actions/download-artifact@v4
        with:
          # ⚠️ EXPLICITLY x64. The client is a matrix now, and a bare artifact name would
          # be ambiguous the moment a second architecture uploads one. The pusher is not
          # built for arm64 yet, so pairing it with an arm64 client would produce a
          # package whose two halves are different architectures - which installs and then
          # fails at launch in a way nothing here would catch.
          name: hamdeck-client-deploy-x64
          path: pusher/packaging/dist/hamdeck-pusher/client

      - name: Both applications are present before packing
        shell: pwsh
        run: |
          # ⚠️ Check BEFORE packing, not after. vpk will happily package a directory with a
          # missing client and produce a perfectly valid installer that is quietly missing
          # half the product - and nothing downstream would notice.
          $root = "pusher\packaging\dist\hamdeck-pusher"
          foreach ($f in @("$root\hamdeck-pusher.exe", "$root\client\hamdeck-qml.exe")) {
            if (-not (Test-Path $f)) { throw "missing from the package: $f" }
            "found $f"
          }

      # ⚠️ SIGN AFTER BOTH APPLICATIONS ARE STAGED, AND RECURSE.
      #
      # This used to run before the Qt client was fetched, so it signed the pusher and left
      # the client - which is now inside the same package - unsigned. Signing half a
      # package is the failure that looks entirely fine: the installer is signed, the app
      # you launch is signed, and the other executable beside it is not.
      #
      # files-folder-recurse is what reaches client\ ; without it the filter matches only
      # the top level and the omission is silent.
      #
      # Skipped cleanly with no secrets, so a fork still builds an unsigned package rather
      # than failing. Gated on `if:` rather than a swallowed error - a signing step that
      # hides its own failure is how an unsigned build ships believing it was signed.
      - name: Sign both applications
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\pusher\packaging\dist\hamdeck-pusher
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Install vpk
        run: dotnet tool install -g vpk
        shell: pwsh

      # ⚠️ Velopack signs through Azure Artifact Signing NATIVELY, with a metadata file
      # rather than the signing action - so the exe is signed by vpk as part of packing,
      # and the separate "Sign the app" step above no longer has to reach inside the
      # output folder. Auth is DefaultAzureCredential, which picks the service principal
      # up out of the environment below.
      - name: Pack and sign with Velopack
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        working-directory: pusher
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          # ⚠️ UTF-8 WITHOUT A BOM. Velopack's docs are explicit about this, and
          # PowerShell's default Out-File writes a BOM that makes the JSON unparseable.
          $meta = [ordered]@{
            Endpoint               = "${{ secrets.AZURE_SIGNING_ENDPOINT }}"
            CodeSigningAccountName = "${{ secrets.AZURE_SIGNING_ACCOUNT }}"
            CertificateProfileName = "${{ secrets.AZURE_SIGNING_PROFILE }}"
          } | ConvertTo-Json
          [IO.File]::WriteAllText("$PWD\packaging\azuresign.json", $meta, (New-Object Text.UTF8Encoding $false))

          # ⚠️ The tag carries a leading v; SemVer here must not.
          $ver = "${{ github.ref_name }}" -replace '^v',''
          if ($ver -notmatch '^\d+\.\d+\.\d+') { $ver = "0.0.0-dev" }
          "packing version $ver"

          vpk pack --packId HamDeckPusher --packVersion $ver `
                   --packDir packaging\dist\hamdeck-pusher `
                   --mainExe hamdeck-pusher.exe `
                   --packTitle "HamDeck Wavelog Pusher" `
                   --packAuthors "WA0O" `
                   --icon ..\packaging\icons\hamdeck.ico `
                   --outputDir packaging\Releases `
                   --azureTrustedSignFile packaging\azuresign.json
          Remove-Item packaging\azuresign.json -Force

      - name: The installer is actually signed
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        working-directory: pusher
        shell: pwsh
        run: |
          # ⚠️ Ask the OS, not the build log. A packer that silently skipped signing and a
          # packer that signed both look identical in stdout; Authenticode status does not.
          $setup = Get-ChildItem packaging\Releases\*Setup.exe | Select-Object -First 1
          if (-not $setup) { throw "vpk produced no Setup.exe" }
          $sig = Get-AuthenticodeSignature $setup.FullName
          "Setup    : $($setup.Name)"
          "Status   : $($sig.Status)"
          "Signer   : $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "installer signature is $($sig.Status), not Valid" }
          if ($sig.SignerCertificate.Subject -notmatch 'Wussler') { throw "unexpected signer" }

          # ⚠️ AND IT MUST BE TIMESTAMPED. This is the check that matters most here and it
          # is the least obvious.
          #
          # Azure Artifact Signing issues certificates that live SEVENTY-TWO HOURS - the
          # one that signed this expires three days from now. The RFC3161 timestamp is the
          # only reason the installer keeps working after that: it proves the signature was
          # made while the certificate was valid. Without it the file is perfectly signed
          # today and INVALID ON THURSDAY, on other people's machines, with nothing here
          # showing anything wrong.
          #
          # vpk timestamps by default today. That is a behaviour of a third-party tool, not
          # a guarantee, and the failure it would cause is silent and delayed - which is
          # exactly the kind worth spending a check on.
          $ts = $sig.TimeStamperCertificate
          "Cert valid : $($sig.SignerCertificate.NotBefore) -> $($sig.SignerCertificate.NotAfter)"
          if (-not $ts) { throw "NOT TIMESTAMPED - this signature dies with the 72-hour certificate" }
          "Timestamper: $($ts.Subject)"

          # ⚠️ AND BOTH APPLICATIONS INSIDE THE PACKAGE, not just the installer around them.
          # A signed installer carrying an unsigned executable is the shape that gets
          # flagged after installation rather than during download - the worst time to find
          # out, because by then it is on someone else's machine.
          foreach ($rel in @("hamdeck-pusher.exe", "client\hamdeck-qml.exe")) {
            $p = "packaging\dist\hamdeck-pusher\$rel"
            $s2 = Get-AuthenticodeSignature $p
            "$rel : $($s2.Status)"
            if ($s2.Status -ne 'Valid') { throw "$rel is $($s2.Status), not Valid" }
            if (-not $s2.TimeStamperCertificate) { throw "$rel is not timestamped" }
          }

      - uses: actions/upload-artifact@v4
        with: { name: hamdeck-pusher-windows-installer, path: pusher/packaging/Releases/* }

  macos:
    # ⚠️ RUNS AFTER publish, NOT BEFORE IT, AND THAT IS DELIBERATE.
    #
    # This runner pool queues for a long time. Gating the release on it would mean the
    # Windows installer waits hours behind a Mac build, so the release is published first
    # and this job attaches its artifact to the finished release when it gets there.
    #
    # It is also no longer `continue-on-error`. It used to be, because nobody had a Mac
    # and an artifact nobody has run is worse than none. There is a Mac now, and a job
    # allowed to fail quietly while producing something people install is the worse of the
    # two risks.
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/')
    # ⚠️ macos-15-intel, NOT macos-13. GitHub RETIRED macos-13 on 12/04/2025, and a job
    # targeting a retired label does not fail - it queues FOREVER. This one sat "queued"
    # looking like a slow pool while never being scheduled at all, which is worse than an
    # error because it reads as patience rather than breakage.
    #
    # macos-15-intel is GitHub's documented migration target for macos-13. Intel is itself
    # on a clock: Apple has dropped x86_64 and GitHub retires the last Intel image in
    # autumn 2027, so the arm64 leg is not optional forever.
    #
    # ⚠️ macos-14 is NOT the answer either - it began deprecation 07/06 and is fully
    # unsupported from 11/02.
    runs-on: macos-15-intel
    permissions:
      contents: write
    env:
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          # ⚠️ NOT qtdeclarative. Qt Quick is part of the BASE install in Qt 6,
          # and naming it as an add-on makes aqt fail to parse the package XML -
          # which kills the whole step before a single line is compiled.
          modules: 'qtwebsockets qtmultimedia'

      - name: Build
        run: |
          cmake -S client -B client/build -DCMAKE_BUILD_TYPE=Release
          cmake --build client/build

      - name: Run the binary
        run: QT_QPA_PLATFORM=offscreen ./client/build/hamdeck-qml --selftest

      # ⚠️ A TEMPORARY KEYCHAIN, not the login keychain. The runner is shared
      # infrastructure; importing a signing identity into the default keychain leaves it
      # for whatever runs next. This one is created, used, and destroyed with the job.
      - name: Import the signing identity
        if: ${{ env.APPLE_CERT_P12 != '' }}
        env:
          P12: ${{ secrets.APPLE_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a GUI prompt that nothing can answer and the
          # job hangs until it times out rather than failing.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "identity available:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Store the notarisation credentials
        if: ${{ env.APPLE_CERT_P12 != '' }}
        env:
          KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          echo "$KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc.p8"
          # ⚠️ The TEAM key. Apple's own docs: individual keys cannot use notaryTool.
          xcrun notarytool store-credentials hamdeck-notary \
            --key "$RUNNER_TEMP/asc.p8" --key-id "$KEY_ID" --issuer "$ISSUER" \
            --keychain "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/asc.p8"

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Pack, sign and notarise
        if: ${{ env.APPLE_CERT_P12 != '' }}
        run: |
          set -euo pipefail
          mkdir -p client/packaging/stage
          cp client/build/hamdeck-qml client/packaging/stage/
          macdeployqt client/packaging/stage/hamdeck-qml -qmldir=client/qml || true
          VER="${GITHUB_REF_NAME#v}"
          # ⚠️ --noInst: a signed .pkg needs a Developer ID INSTALLER certificate, which is
          # a second certificate. Apple caps Developer ID certs at 5 per account, so this
          # ships the signed .app rather than burning one for an installer nobody asked for.
          vpk pack --packId HamDeckRemote --packVersion "$VER" \
                   --packDir client/packaging/stage \
                   --mainExe hamdeck-qml \
                   --packTitle "HamDeck Remote" --packAuthors "WA0O" \
                   --outputDir client/packaging/Releases \
                   --noInst \
                   --signAppIdentity "Developer ID Application: henry Wussler (V829EBE8HH)" \
                   --signEntitlements client/packaging/entitlements.plist \
                   --notaryProfile hamdeck-notary \
                   --keychain "$KEYCHAIN"

      # ⚠️ ASK THE OS, NOT THE BUILD LOG. A pack that quietly skipped signing and one that
      # signed and notarised look the same in stdout. spctl is what Gatekeeper itself uses,
      # and stapler proves the ticket is attached rather than merely issued - an app that
      # is notarised but not stapled still warns when the machine is offline.
      - name: Prove it is signed, notarised and stapled
        if: ${{ env.APPLE_CERT_P12 != '' }}
        run: |
          set -euo pipefail
          APP=$(find client/packaging/Releases -name "*.app" -maxdepth 3 | head -1)
          [ -n "$APP" ] || { echo "vpk produced no .app"; exit 1; }
          echo "== codesign =="   && codesign --verify --deep --strict --verbose=2 "$APP"
          echo "== signer =="     && codesign -dvv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Runtime"
          echo "== gatekeeper ==" && spctl --assess --type execute --verbose=4 "$APP"
          echo "== staple =="     && xcrun stapler validate "$APP"

      - name: Attach it to the release
        if: ${{ env.APPLE_CERT_P12 != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd client/packaging/Releases
          # The .app is a directory; ship it zipped, preserving symlinks and the signature.
          APP=$(find . -name "*.app" -maxdepth 2 | head -1)
          ditto -c -k --sequesterRsrc --keepParent "$APP" "HamDeckRemote-macOS.zip"
          gh release upload "${GITHUB_REF_NAME}" HamDeckRemote-macOS.zip --clobber

      - name: Destroy the keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" 2>/dev/null || true

  # ⚠️ WITHOUT THIS THERE IS NO PERMANENT DOWNLOAD. Actions artifacts expire in
  # 90 days and are reachable only by someone logged in who can find the right
  # run - which is why every "here is the installer" link had to be dug out of a
  # workflow run by hand. A Release gives /releases/latest, and it does not expire.
  #
  # ⚠️ needs linux+windows ONLY. The macos job sits queued for hours on this
  # runner pool; gating the release on it would mean never publishing at all.
  publish:
    # ⚠️ pusher-windows is in `needs` so a broken pusher build BLOCKS the release rather
    # than publishing a set of artifacts with one quietly missing. The guard below only
    # checks that SOME .exe exists, which a missing pusher installer would still satisfy.
    needs: [linux, windows, pusher-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          find dist -type f | sort
          # ⚠️ Refuse to publish without an installer. An empty release is worse
          # than none: it looks like the build shipped when nothing did.
          # ⚠️ *Setup.exe, not *.exe. The client's staged tree is among the artifacts now,
          # so a bare *.exe glob uploads hamdeck-qml.exe as a loose file - an executable
          # that cannot run without the Qt DLLs beside it, published next to the real
          # installer where somebody will reasonably try it.
          test -n "$(find dist -name '*Setup.exe' -print -quit)" || {
            echo "no installer among the artifacts - refusing to publish"; exit 1; }
          cat > notes.md <<'NOTES'
          ## HamDeck — download `HamDeckPusher-win-Setup.exe`

          **One installer, both applications.** It installs the **Wavelog Pusher** and the
          **HamDeck Remote** client together, and updates them together. The `.nupkg`,
          `RELEASES` and `releases.win.json` beside it are the update manifest — leave them
          there, they are what future versions install themselves from.

          Everything inside is code-signed and timestamped: the installer, the pusher, and
          the client.

          ### Windows will warn you. Here is exactly what to do.

          You will see **"Windows protected your PC"**. Click **More info** → **Run anyway**.

          **Check the Publisher line first. It must say `Henry Wussler`.** The installer is
          code-signed through Microsoft's Artifact Signing service, so Windows can tell you
          who built it. If it says Unknown or another name, stop — that file is not this one.

          **Why the warning happens:** SmartScreen asks "have I seen this file before?", not
          "is this safe?". New releases from small publishers always start at no. It clears
          as people install it. Microsoft removed the certificate-based bypass in 2024, so
          there is no way to skip that queue.

          ### What it does
          - Publishes your rig's frequency and mode to **Wavelog**, so the log follows the radio
          - **Stands down** while a remote client is operating the station
          - Serves the HamDeck REST API on `localhost:5001` so **Stream Deck buttons work**

          Settings live in `%APPDATA%\HamDeckPusher` and updates never touch them.

          ### Known gaps
          CW keyer, voice memories and RX antenna are not implemented on the C++ host yet.
          Those buttons say so plainly rather than failing silently.
          NOTES
          # ⚠️ UPLOAD THE VELOPACK FILES, NOT JUST THE .exe.
          #
          # The updater reads releases.win.json / RELEASES and downloads the .nupkg from the
          # SAME release. Publishing only Setup.exe produces a release that installs fine and
          # can never update anything - and nothing about it looks wrong until an update is
          # expected and silently does not arrive.
          gh release create "${GITHUB_REF_NAME}" \
            --title "HamDeck ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            $(find dist -name '*Setup.exe') $(find dist -name '*.deb') \
            $(find dist -name '*.nupkg') $(find dist -name 'RELEASES') \
            $(find dist -name 'releases.*.json')
