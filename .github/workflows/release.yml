name: release

# Builds the client for each platform ON that platform.
#
# ⚠️ EVERY JOB RUNS THE BINARY BEFORE PACKAGING IT. A green build proves the code
# compiles and proves nothing about whether the program starts - the .NET client
# shipped a release that could not launch at all while every test passed
# (docs/internal/CARRYOVER.md section 8). `--selftest` walks the startup path and exits, and it
# runs under a timeout because a hang is a failure too.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  linux:
    # ⚠️ NATIVE RUNNER PER ARCHITECTURE. NO CROSS-COMPILATION, EVER.
    #
    # This is the standing rule for every target in this workflow. Cross-compiling Qt is
    # unpleasant, and PyInstaller cannot cross-compile AT ALL - there is no toolchain and
    # no trick, which is why the pusher would have blocked arm64 forever. GitHub added
    # arm64 standard runners for PRIVATE repositories on 01/29/2026 and they draw on the
    # same free minutes, so the problem is dissolved rather than solved.
    #
    # ⚠️ Private-repo arm64 runners get TWO vCPUs where public gets four. Expect a
    # noticeably longer wall clock, and do not read slowness as a hang.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64,   runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build \
            qt6-base-dev qt6-declarative-dev qt6-websockets-dev qt6-multimedia-dev \
            qml6-module-qtqml qml6-module-qtqml-workerscript \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-templates \
            qml6-module-qtquick-window qml6-module-qtquick-shapes \
            libasound2-dev libssl-dev
      - name: Build
        run: |
          # ⚠️ THE VERSION COMES FROM THE TAG. Without this the client falls back
          # to 0.0.0 and the .deb / Mac bundle carry a version that has nothing to
          # do with the release - which is exactly how v0.1.29 shipped a package
          # called hamdeck-client_0.1.15.
          VER="${GITHUB_REF_NAME#v}"
          case "$VER" in [0-9]*.[0-9]*.[0-9]*) ;; *) VER="0.0.0" ;; esac
          echo "building client version $VER"
          cmake -S client -B client/build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX=/usr \
            -DHAMDECK_VERSION="$VER"
          cmake --build client/build
      - name: Test
        run: ctest --test-dir client/build --output-on-failure
      - name: Run the binary
        run: QT_QPA_PLATFORM=offscreen timeout 60 ./client/build/hamdeck-qml --selftest
      - name: Package
        run: |
          cd client/build && cpack -G DEB
          # ⚠️ READ THE VERSION BACK OUT OF THE PACKAGE, not off the filename.
          # The filename is what CPack chose to call it; the control field is
          # what dpkg and apt actually compare when deciding whether an upgrade
          # is an upgrade. They come from the same variable today - checking the
          # one that MATTERS costs nothing and is the one that could silently
          # diverge.
          VER="${GITHUB_REF_NAME#v}"
          case "$VER" in [0-9]*.[0-9]*.[0-9]*) ;; *) VER="0.0.0" ;; esac
          for d in *.deb; do
            got="$(dpkg-deb -f "$d" Version)"
            echo "  $d: control Version=$got"
            [ "$got" = "$VER" ] || { echo "  expected $VER - the release would ship a package that says it is something else"; exit 1; }
          done
      # ⚠️ Verify the ARTIFACT, not the build: install the package and run what
      # it installed, from the path it installed to.
      - name: Install the package and run what it installed
        run: |
          sudo apt-get install -y -qq ./client/build/*.deb
          QT_QPA_PLATFORM=offscreen timeout 60 /usr/bin/hamdeck-qml --selftest
      # ⚠️ A RELEASE GATE, ADDED BECAUSE 0.1.2 SHIPPED A WINDOW NOBODY COULD
      # MOVE. Every check before it ran under the offscreen QPA - no window
      # manager, no decoration - so a title bar placed above the top of the
      # screen could not be seen. This runs a real WM and reads back where the
      # decorated frame landed. If it fails, no installer is produced.
      - name: Where does the window actually land
        run: |
          sudo apt-get install -y -qq xvfb openbox x11-utils xdotool
          export HAMDECK_CLIENT=/usr/bin/hamdeck-qml
          for s in 1024x600 1366x768 1920x1080 2560x1440; do
            ./tools/placement_check.sh $s fresh || exit 1
          done
          ./tools/placement_check.sh 1920x1080 saved-at-origin || exit 1
          ./tools/placement_check.sh 1920x1080 saved-offscreen || exit 1
          ./tools/placement_check.sh 1024x600  saved-at-origin || exit 1
      # ⚠️ The artifact name carries the architecture. Two matrix legs uploading to one
      # name is a race whose winner is arbitrary - you get one .deb, for whichever
      # architecture happened to finish last, with nothing anywhere saying so.
      - uses: actions/upload-artifact@v4
        with:
          # ⚠️ Block style, not `with: { ... }`. A ${{ }} expression inside a YAML FLOW
          # mapping makes the parser choke on the braces - the workflow is then invalid in
          # a way the editor shows but a quick eyeball does not.
          name: hamdeck-linux-deb-${{ matrix.arch }}
          path: client/build/*.deb

  windows:
    # ⚠️ THE ONE TARGET WHERE "NEVER CROSS-COMPILE" CANNOT FULLY HOLD.
    #
    # Qt's Windows arm64 kit is called win64_msvc2022_arm64_cross_compiled, and there is
    # no native-host alternative - Qt builds it that way. The runner IS native arm64, so
    # the compiler and the tests run natively, but the Qt kit itself is a cross build.
    # Recorded rather than papered over: the rule is a default, and this is its exception.
    #
    # ⚠️ arm64 is an OPTIMISATION here, not enablement. Windows on ARM runs the x64 build
    # under emulation already, so nothing is unreachable without this - which is also why
    # the arm64 leg does not fail the whole matrix.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64,   runner: windows-latest,  qtarch: win64_msvc2022_64 }
          - { arch: arm64, runner: windows-11-arm,  qtarch: win64_msvc2022_arm64_cross_compiled }
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          # ⚠️ host MUST be `windows`, even on the arm64 runner.
          #
          # The action infers the host from the machine, so on windows-11-arm it asked for
          # host `windows_arm64` - and Qt does not publish desktop kits under that host at
          # all. The failure names the packages rather than the host:
          #   "The packages ['qt_base','qtmultimedia','qtwebsockets'] were not found"
          # which reads like the modules are wrong when the repository being searched is.
          #
          # Qt ships the arm64 kit under the ordinary `windows` host, which is the same
          # fact as its name - win64_msvc2022_arm64_CROSS_COMPILED. The host tools are x64
          # and run under emulation on this runner.
          host: windows
          arch: ${{ matrix.qtarch }}
          version: '6.8.1'
          # ⚠️ NOT qtdeclarative. Qt Quick is part of the BASE install in Qt 6,
          # and naming it as an add-on makes aqt fail to parse the package XML -
          # which kills the whole step before a single line is compiled.
          modules: 'qtwebsockets qtmultimedia'
      - name: Build
        shell: pwsh
        run: |
          # ⚠️ THE VERSION COMES FROM THE TAG - see the Linux leg for what the
          # hardcoded fallback cost. The tag carries a leading v; CMake must not.
          $ver = "${{ github.ref_name }}" -replace '^v',''
          if ($ver -notmatch '^\d+\.\d+\.\d+') { $ver = "0.0.0" }
          "building client version $ver"
          cmake -S client -B client/build -DCMAKE_BUILD_TYPE=Release "-DHAMDECK_VERSION=$ver"
          cmake --build client/build --config Release
      - name: Run the binary
        shell: pwsh
        run: |
          # ⚠️ On Windows this is the check that matters: a Qt app missing its
          # platform plugin exits silently with no window and no message.
          $p = Start-Process -FilePath "client\build\Release\hamdeck-qml.exe" `
               -ArgumentList "--selftest" -NoNewWindow -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "selftest failed: $($p.ExitCode)" }
      # ⚠️ A GREEN WINDOWS BUILD DOES NOT MEAN THE ICON IS IN THE BINARY.
      # CMake ignores a .rc silently when the RC language is not enabled, so
      # 0.1.12 shipped with the resource committed, referenced, and never once
      # compiled. This looks inside the exe for the artwork itself.
      - name: The icon is actually in the exe
        run: python tools/check_exe_icon.py client\build\Release\hamdeck-qml.exe packaging\icons\hamdeck-256.png
        shell: cmd

      # ⚠️ THE ARM64 KIT HAS NO DEPLOYMENT TOOLS. It is a CROSS-COMPILED kit, so
      # windeployqt lives in the HOST (x64) Qt, not the target - which is why resolving it
      # inside QT_ROOT_DIR found nothing. Qt's documented answer is a host installation
      # alongside the target one.
      #
      # Installed to a separate directory so it cannot shadow the arm64 kit the build just
      # used, and only on the arm64 leg - the x64 kit already has its own.
      - uses: jurplel/install-qt-action@v4
        if: ${{ matrix.arch == 'arm64' }}
        with:
          host: windows
          arch: win64_msvc2022_64
          version: '6.8.1'
          # ⚠️ THE SAME MODULES AS THE TARGET KIT. windeployqt resolves module DLLs
          # through its own installation, so a host Qt without qtwebsockets fails with
          # "Unable to find dependent libraries ... Qt6WebSockets.dll" - pointing at the
          # HOST path, which reads as the target kit being broken.
          modules: 'qtwebsockets qtmultimedia'
          dir: ${{ github.workspace }}/QtHost
          set-env: false

      - name: Stage the Qt runtime beside the binary
        shell: pwsh
        run: |
          mkdir packaging\deploy
          copy client\build\Release\hamdeck-qml.exe packaging\deploy\
          # windeployqt pulls in the platform plugin, the QML modules and the
          # Qt DLLs. Without --qmldir it misses the QML imports entirely and the
          # app launches to a blank window.
          #
          # ⚠️ BY ABSOLUTE PATH. On the arm64 kit windeployqt is not on PATH, and the bare
          # name fails with "not recognized as a name of a cmdlet" - which reads like a
          # missing tool rather than a PATH that differs between kits. QT_ROOT_DIR is set
          # by install-qt-action for whichever kit was installed, so this is correct for
          # both legs rather than a special case for one.
          # ⚠️ Print what the kit ACTUALLY contains before deciding it is missing something.
          # The previous failure said "not found" and left the reason to inference; a
          # listing turns the next surprise into a fact.
          # ⚠️ List the TOOLS the kit actually has. Filtering to *deploy* answered only the
          # question I already knew the answer to; qtpaths.exe is the one that decides
          # whether the host tool can resolve against this kit at all, and Qt's own
          # guidance is explicit that no native arm64 windeployqt exists.
          Write-Host "-- tools in $env:QT_ROOT_DIR\bin --"
          Get-ChildItem "$env:QT_ROOT_DIR\bin" -Filter "*.exe" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "   $($_.Name)" }

          $wdq = Join-Path $env:QT_ROOT_DIR "bin\windeployqt.exe"
          if (-not (Test-Path $wdq)) {
            # Cross-compiled kit: fall back to the host Qt installed above.
            $hostWdq = Get-ChildItem "${{ github.workspace }}/QtHost" -Recurse -Filter windeployqt.exe -ErrorAction SilentlyContinue |
                       Select-Object -First 1
            if (-not $hostWdq) { throw "windeployqt found in neither the target kit ($wdq) nor the host install" }
            $wdq = $hostWdq.FullName
            Write-Host "using host windeployqt: $wdq"
          }
          # ⚠️ --qtpaths points the HOST tool at the TARGET kit. Without it the host tool
          # deploys x64 Qt DLLs beside an arm64 exe: it succeeds, and the app fails to
          # start on the machine it was built for.
          $qtpaths = Join-Path $env:QT_ROOT_DIR "bin\qtpaths.exe"
          if (Test-Path $qtpaths) {
            Write-Host "deploying against target kit via $qtpaths"
            & $wdq --qtpaths $qtpaths --qmldir client\qml --release packaging\deploy\hamdeck-qml.exe
          } else {
            Write-Host "no qtpaths in the target kit - deploying with the host tool alone"
            & $wdq --qmldir client\qml --release packaging\deploy\hamdeck-qml.exe
          }
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed with $LASTEXITCODE" }

          # ⚠️ CROSS-COMPILED KIT: OVERWRITE WHAT THE HOST TOOL JUST COPIED.
          #
          # --qtpaths is supposed to point the host tool at the target kit. On the
          # arm64 kit there is no qtpaths.exe to point at - it is
          # win64_msvc2022_arm64_cross_compiled, which ships no runnable tools at
          # all - so the deploy falls through to the host tool alone and copies the
          # HOST's x64 Qt beside an arm64 exe. Measured, not guessed: the arch check
          # below printed `exe=arm64 Qt6Core=x64` and refused, which is the only
          # reason this was ever visible.
          #
          # So the target kit's own binaries are copied over the top afterwards.
          # Ugly, and the alternative is shipping a build that installs and dies.
          #
          # ⚠️ ONLY when the target kit had no windeployqt of its own. The x64 leg
          # deploys correctly and must not be touched by this.
          if (-not (Test-Path (Join-Path $env:QT_ROOT_DIR "bin\windeployqt.exe"))) {
            Write-Host "cross-compiled kit - replacing host Qt with the target kit's own"
            Get-ChildItem "$env:QT_ROOT_DIR\bin" -Filter "Qt6*.dll" |
              Copy-Item -Destination packaging\deploy -Force
            foreach ($d in 'platforms','styles','imageformats','tls','networkinformation',
                           'multimedia','iconengines','generic','qmltooling') {
              $src = Join-Path $env:QT_ROOT_DIR "plugins\$d"
              if (Test-Path $src) { Copy-Item $src packaging\deploy -Recurse -Force }
            }
            if (Test-Path "$env:QT_ROOT_DIR\qml") {
              Copy-Item "$env:QT_ROOT_DIR\qml\*" packaging\deploy -Recurse -Force
            }
          }

          # ⚠️ THE DEPLOYED DLLs MUST MATCH THE EXE'S ARCHITECTURE.
          #
          # A host windeployqt will happily copy x64 Qt DLLs beside an arm64 binary and
          # report success. The result installs, launches, and dies immediately - a
          # failure that reaches a user because nothing in a build log looks wrong. So the
          # PE machine type is read straight out of the file rather than assumed.
          function Get-PEMachine($path) {
            $fs = [IO.File]::OpenRead($path)
            try {
              $br = New-Object IO.BinaryReader($fs)
              $fs.Position = 0x3C
              $fs.Position = $br.ReadInt32() + 4      # PE signature, then COFF header
              return $br.ReadUInt16()
            } finally { $fs.Dispose() }
          }
          $want = Get-PEMachine "packaging\deploy\hamdeck-qml.exe"
          $core = Get-PEMachine "packaging\deploy\Qt6Core.dll"
          $names = @{ 0x8664 = "x64"; 0xAA64 = "arm64"; 0x14C = "x86" }
          Write-Host ("exe={0} Qt6Core={1}" -f $names[[int]$want], $names[[int]$core])
          if ($want -ne $core) {
            throw "architecture mismatch: exe is $($names[[int]$want]) but Qt6Core.dll is $($names[[int]$core]) - the app would not start"
          }
      - name: Run it again from the staged directory
        shell: pwsh
        run: |
          # Proves the DEPLOYED tree works, not just the build tree - which is
          # where the platform-plugin failure actually shows up.
          $p = Start-Process -FilePath "packaging\deploy\hamdeck-qml.exe" `
               -ArgumentList "--selftest" -NoNewWindow -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "deployed selftest failed: $($p.ExitCode)" }
      # ⚠️ NO INSTALLER HERE ANY MORE. The client used to ship its own unsigned Inno
      # setup, which meant a second download, a second signature to arrange, and a second
      # SmartScreen reputation starting from zero - while every download of one did nothing
      # for the other. It is now packaged together with the pusher in one signed Velopack
      # package, so this job's job is to hand over a staged tree.
      - uses: actions/upload-artifact@v4
        with:
          name: hamdeck-client-deploy-${{ matrix.arch }}
          path: packaging/deploy/**

  pusher-windows:
    # ⚠️ ONE PACKAGE, TWO APPLICATIONS. This job now needs the Qt client's staged tree,
    # because both ship inside a single signed Velopack package: one download, one
    # signature, one update channel, and one SmartScreen reputation that both halves feed
    # instead of two starting from zero and neither getting anywhere.
    needs: [windows]
    # ⚠️ JOB LEVEL, NOT STEP LEVEL. A step's own `env:` is not in scope for that same
    # step's `if:` - the env context there resolves workflow- and job-level values only.
    # Defined on the step, the signing gate would read empty and the signing steps would
    # ALWAYS SKIP, shipping an unsigned installer while the log looked deliberate. That is
    # the exact failure this gate exists to prevent, so it is worth the odd placement.
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    # The Wavelog data pusher: a Python/Tk desktop app, frozen with PyInstaller.
    #
    # ⚠️ THE ORDER OF THESE STEPS IS THE POINT. Tests run before the freeze, and then
    # --selftest runs AGAINST THE FROZEN EXE - because the two failures this has to catch
    # happen at different stages. A logic bug fails the first; PyInstaller bundling an
    # empty package, or missing tkinter, only fails the second. A bundle that starts is
    # not a bundle that works.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Tests
        working-directory: pusher
        run: python -m unittest discover -s tests -v
      - name: Selftest, from source
        working-directory: pusher
        run: python -m hamdeck_pusher --selftest
      - name: Freeze
        working-directory: pusher
        # ⚠️ EVERY PATH INPUT HERE IS ABSOLUTE, AND THAT IS THE RULE, NOT A PREFERENCE.
        #
        # PyInstaller resolves --icon and --version-file relative to --specpath, NOT to the
        # working directory. Both were written relative and both broke, on separate days:
        #   --icon         ..\packaging\icons\hamdeck.ico  -> pusher\packaging\..\packaging\...
        #   --version-file packaging\version_info.txt       -> pusher\packaging\packaging\...
        # The second one landed AFTER the first was fixed, because the fix was applied to
        # the one flag that had failed rather than to the class of mistake.
        #
        # ⚠️ A LINUX FREEZE CANNOT CATCH EITHER. PyInstaller never opens the .ico or the
        # version resource when the output is an ELF binary, so a local dry run passes with
        # both paths wrong. A local freeze proves the bundle is not empty. It proves
        # nothing at all about Windows packaging inputs.
        run: |
          pip install pyinstaller velopack
          pyinstaller --noconfirm --clean --onedir --windowed ^
            --name hamdeck-pusher ^
            --icon "%GITHUB_WORKSPACE%\packaging\icons\hamdeck.ico" ^
            --paths . ^
            --version-file "%GITHUB_WORKSPACE%\pusher\packaging\version_info.txt" ^
            --distpath packaging\dist ^
            --workpath packaging\work ^
            --specpath packaging ^
            packaging\entry.py
        shell: cmd
      - name: Selftest, on the FROZEN exe
        working-directory: pusher
        shell: pwsh
        run: |
          # ⚠️ A --windowed exe has NO stdout, so the report goes to a file. Without this
          # a failing frozen build gives CI an exit code and nothing to act on - and that
          # is the one occasion the detail matters.
          $p = Start-Process -FilePath "packaging\dist\hamdeck-pusher\hamdeck-pusher.exe" `
               -ArgumentList "--selftest","--report","selftest.txt" -PassThru -Wait
          if (Test-Path selftest.txt) { Get-Content selftest.txt }
          if ($p.ExitCode -ne 0) { throw "frozen selftest failed: $($p.ExitCode)" }
      - name: The icon is actually in the exe
        working-directory: pusher
        run: python ..\tools\check_exe_icon.py packaging\dist\hamdeck-pusher\hamdeck-pusher.exe ..\packaging\icons\hamdeck-256.png
        shell: cmd

      # ⚠️ AND THE VERSION RESOURCE IS ACTUALLY IN THE EXE.
      #
      # Same reason the icon has its own check: a path handed to PyInstaller can be wrong
      # in a way that produces a perfectly good binary missing the thing you asked for.
      # --version-file pointed at the wrong path for a whole release and the only symptom
      # would have been an exe with no company or product name - which is precisely the
      # shape the Defender heuristic scores badly, i.e. the thing it was added to fix.
      - name: The version resource is actually in the exe
        shell: pwsh
        run: |
          $exe = "pusher\packaging\dist\hamdeck-pusher\hamdeck-pusher.exe"
          $vi = (Get-Item $exe).VersionInfo
          "ProductName : $($vi.ProductName)"
          "CompanyName : $($vi.CompanyName)"
          "FileVersion : $($vi.FileVersion)"
          if ($vi.ProductName -ne 'HamDeck Wavelog Pusher') { throw "version resource missing or wrong: ProductName='$($vi.ProductName)'" }
          if ([string]::IsNullOrWhiteSpace($vi.CompanyName)) { throw "version resource has no CompanyName" }
      - name: Bring in the Qt client
        uses: actions/download-artifact@v4
        with:
          # ⚠️ EXPLICITLY x64. The client is a matrix now, and a bare artifact name would
          # be ambiguous the moment a second architecture uploads one. The pusher is not
          # built for arm64 yet, so pairing it with an arm64 client would produce a
          # package whose two halves are different architectures - which installs and then
          # fails at launch in a way nothing here would catch.
          name: hamdeck-client-deploy-x64
          path: pusher/packaging/dist/hamdeck-pusher/client

      - name: Both applications are present before packing
        shell: pwsh
        run: |
          # ⚠️ Check BEFORE packing, not after. vpk will happily package a directory with a
          # missing client and produce a perfectly valid installer that is quietly missing
          # half the product - and nothing downstream would notice.
          $root = "pusher\packaging\dist\hamdeck-pusher"
          foreach ($f in @("$root\hamdeck-pusher.exe", "$root\client\hamdeck-qml.exe")) {
            if (-not (Test-Path $f)) { throw "missing from the package: $f" }
            "found $f"
          }

      # ⚠️ SIGN AFTER BOTH APPLICATIONS ARE STAGED, AND RECURSE.
      #
      # This used to run before the Qt client was fetched, so it signed the pusher and left
      # the client - which is now inside the same package - unsigned. Signing half a
      # package is the failure that looks entirely fine: the installer is signed, the app
      # you launch is signed, and the other executable beside it is not.
      #
      # files-folder-recurse is what reaches client\ ; without it the filter matches only
      # the top level and the omission is silent.
      #
      # Skipped cleanly with no secrets, so a fork still builds an unsigned package rather
      # than failing. Gated on `if:` rather than a swallowed error - a signing step that
      # hides its own failure is how an unsigned build ships believing it was signed.
      - name: Sign both applications
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\pusher\packaging\dist\hamdeck-pusher
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Install vpk
        run: dotnet tool install -g vpk
        shell: pwsh

      # ⚠️ Velopack signs through Azure Artifact Signing NATIVELY, with a metadata file
      # rather than the signing action - so the exe is signed by vpk as part of packing,
      # and the separate "Sign the app" step above no longer has to reach inside the
      # output folder. Auth is DefaultAzureCredential, which picks the service principal
      # up out of the environment below.
      - name: Pack and sign with Velopack
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        working-directory: pusher
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          # ⚠️ UTF-8 WITHOUT A BOM. Velopack's docs are explicit about this, and
          # PowerShell's default Out-File writes a BOM that makes the JSON unparseable.
          $meta = [ordered]@{
            Endpoint               = "${{ secrets.AZURE_SIGNING_ENDPOINT }}"
            CodeSigningAccountName = "${{ secrets.AZURE_SIGNING_ACCOUNT }}"
            CertificateProfileName = "${{ secrets.AZURE_SIGNING_PROFILE }}"
          } | ConvertTo-Json
          [IO.File]::WriteAllText("$PWD\packaging\azuresign.json", $meta, (New-Object Text.UTF8Encoding $false))

          # ⚠️ The tag carries a leading v; SemVer here must not.
          $ver = "${{ github.ref_name }}" -replace '^v',''
          if ($ver -notmatch '^\d+\.\d+\.\d+') { $ver = "0.0.0-dev" }
          "packing version $ver"

          vpk pack --packId HamDeckPusher --packVersion $ver `
                   --packDir packaging\dist\hamdeck-pusher `
                   --mainExe hamdeck-pusher.exe `
                   --packTitle "HamDeck" `
                   --packAuthors "WA0O" `
                   --icon ..\packaging\icons\hamdeck.ico `
                   --outputDir packaging\Releases `
                   --azureTrustedSignFile packaging\azuresign.json
          Remove-Item packaging\azuresign.json -Force

          # ⚠️ THE packId STAYS HamDeckPusher. It is Velopack's UPDATE IDENTITY -
          # every installed copy looks for that id, so changing it orphans every
          # existing install silently: they keep running and simply never see
          # another update. Only the FILE NAME and the display title change here.
          #
          # ⚠️ And the file name is safe to change precisely because the updater
          # never fetches it: RELEASES points at the .nupkg. Setup.exe is only
          # what a human downloads once - which is the whole problem being fixed.
          # This installer carries the Pusher AND the HamDeck Remote client, and
          # calling it HamDeckPusher-win-Setup.exe meant the release page never
          # said the client was in there at all.
          $packed = Get-ChildItem packaging\Releases\*Setup.exe | Select-Object -First 1
          if (-not $packed) { throw "vpk produced no Setup.exe to rename" }
          $renamed = Join-Path $packed.Directory "HamDeck-win-Setup.exe"
          Move-Item $packed.FullName $renamed -Force
          "renamed $($packed.Name) -> HamDeck-win-Setup.exe"

      # ⚠️ EVERY PLATFORM GETS AN INSTALLER. Mac has a .dmg, Linux has .debs, and
      # Windows had the client only as a folder inside somebody else's package.
      # A zip is not a deliverable: it asks the person downloading it to pick an
      # exe out of 1,369 files and make their own shortcut, and nobody does that.
      #
      # ⚠️ AFTER the Velopack pack, not before. vpk consumes the same staged tree,
      # and Inno must package the SIGNED files - which the signing step above has
      # already put there, recursively, including client\.
      #
      # iscc ships on the GitHub Windows runner images; no install step needed.
      - name: Build the standalone client installer
        working-directory: client/packaging
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          if ($ver -notmatch '^\d+\.\d+\.\d+') { $ver = "0.0.0" }
          $src = "${{ github.workspace }}\pusher\packaging\dist\hamdeck-pusher\client"
          if (-not (Test-Path "$src\hamdeck-qml.exe")) { throw "no staged client at $src" }
          if (-not (Test-Path "$src\platforms\qwindows.dll")) {
            throw "the staged client has no platforms\qwindows.dll - it would install and refuse to start"
          }
          & iscc.exe /Qp "/DAppVersion=$ver" "/DSourceDir=$src" hamdeck-remote.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
          if (-not (Test-Path "HamDeckRemote-win-Setup.exe")) { throw "iscc produced no installer" }
          "built HamDeckRemote-win-Setup.exe ($ver)"

      # The Inno output is a NEW binary that nothing has signed yet - the files
      # inside it are signed, the wrapper around them is not, and SmartScreen
      # judges the wrapper.
      - name: Sign the client installer
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\client\packaging
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: The client installer is actually signed
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        working-directory: client/packaging
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "HamDeckRemote-win-Setup.exe"
          "Status: $($sig.Status)"
          "Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "client installer is not validly signed" }
          if ($sig.SignerCertificate.Subject -notmatch 'Wussler') { throw "unexpected signer" }

      - name: The installer is actually signed
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        working-directory: pusher
        shell: pwsh
        run: |
          # ⚠️ Ask the OS, not the build log. A packer that silently skipped signing and a
          # packer that signed both look identical in stdout; Authenticode status does not.
          $setup = Get-ChildItem packaging\Releases\*Setup.exe | Select-Object -First 1
          if (-not $setup) { throw "vpk produced no Setup.exe" }
          $sig = Get-AuthenticodeSignature $setup.FullName
          "Setup    : $($setup.Name)"
          "Status   : $($sig.Status)"
          "Signer   : $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "installer signature is $($sig.Status), not Valid" }
          if ($sig.SignerCertificate.Subject -notmatch 'Wussler') { throw "unexpected signer" }

          # ⚠️ AND IT MUST BE TIMESTAMPED. This is the check that matters most here and it
          # is the least obvious.
          #
          # Azure Artifact Signing issues certificates that live SEVENTY-TWO HOURS - the
          # one that signed this expires three days from now. The RFC3161 timestamp is the
          # only reason the installer keeps working after that: it proves the signature was
          # made while the certificate was valid. Without it the file is perfectly signed
          # today and INVALID ON THURSDAY, on other people's machines, with nothing here
          # showing anything wrong.
          #
          # vpk timestamps by default today. That is a behaviour of a third-party tool, not
          # a guarantee, and the failure it would cause is silent and delayed - which is
          # exactly the kind worth spending a check on.
          $ts = $sig.TimeStamperCertificate
          "Cert valid : $($sig.SignerCertificate.NotBefore) -> $($sig.SignerCertificate.NotAfter)"
          if (-not $ts) { throw "NOT TIMESTAMPED - this signature dies with the 72-hour certificate" }
          "Timestamper: $($ts.Subject)"

          # ⚠️ AND BOTH APPLICATIONS INSIDE THE PACKAGE, not just the installer around them.
          # A signed installer carrying an unsigned executable is the shape that gets
          # flagged after installation rather than during download - the worst time to find
          # out, because by then it is on someone else's machine.
          foreach ($rel in @("hamdeck-pusher.exe", "client\hamdeck-qml.exe")) {
            $p = "packaging\dist\hamdeck-pusher\$rel"
            $s2 = Get-AuthenticodeSignature $p
            "$rel : $($s2.Status)"
            if ($s2.Status -ne 'Valid') { throw "$rel is $($s2.Status), not Valid" }
            if (-not $s2.TimeStamperCertificate) { throw "$rel is not timestamped" }
          }

      - uses: actions/upload-artifact@v4
        with: { name: hamdeck-pusher-windows-installer, path: pusher/packaging/Releases/* }

      # ⚠️ A SEPARATE ARTIFACT NAME. Two uploads sharing one name is a race with an
      # arbitrary winner - the same trap the arch matrix already carries a warning
      # about, and it would silently drop one of the two Windows installers.
      - uses: actions/upload-artifact@v4
        with: { name: hamdeck-client-windows-installer, path: client/packaging/HamDeckRemote-win-Setup.exe }

  macos:
    # ⚠️ RUNS AFTER publish, NOT BEFORE IT, AND THAT IS DELIBERATE.
    #
    # This runner pool queues for a long time. Gating the release on it would mean the
    # Windows installer waits hours behind a Mac build, so the release is published first
    # and this job attaches its artifact to the finished release when it gets there.
    #
    # It is also no longer `continue-on-error`. It used to be, because nobody had a Mac
    # and an artifact nobody has run is worse than none. There is a Mac now, and a job
    # allowed to fail quietly while producing something people install is the worse of the
    # two risks.
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/')
    # ⚠️ ARM64 RUNNER, UNIVERSAL BINARY. Not Intel.
    #
    # macos-13 was RETIRED 12/04/2025, and a job targeting a retired label does not fail -
    # it queues forever, which is how this job spent months looking patient rather than
    # broken. macos-14 is no better (deprecating now, unsupported 11/02).
    #
    # Intel was the wrong target regardless: Apple stopped selling Intel Macs in 2023,
    # every Mac since 2020 is Apple Silicon, and Rosetta 2 is being wound down. An
    # Intel-only build would run EMULATED on the only Mac available to test it.
    #
    # Qt ships UNIVERSAL macOS binaries, so one arm64 runner produces a binary that is
    # native on both architectures - which is better than choosing, and better than a
    # matrix that would need two signings and two notarisations.
    #
    # ⚠️ The old comment here claimed arm64 had dropped the AGL framework Qt links
    # against. That was written when this label was ALREADY DEAD, so it was never
    # verified. It is not treated as a known obstacle; if it is real, this build says so.
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          # ⚠️ 6.9.2 HERE, 6.8.1 ON WINDOWS - a deliberate skew, not drift.
          #
          # Qt 6.8.1 cannot link on macos-latest: `ld: framework 'AGL' not found`. AGL is
          # Apple's long-removed OpenGL framework, Qt's Gui dependency asks CMake for it,
          # and the Xcode 26 SDK does not have it. 6.9.2 builds cleanly - measured, on a
          # run that got as far as a successful universal build.
          #
          # Windows stays on 6.8.1 because it works there. Moving a platform that builds
          # to chase consistency is how a working target becomes an unknown one.
          version: '6.9.2'
          # ⚠️ NOT qtdeclarative. Qt Quick is part of the BASE install in Qt 6,
          # and naming it as an add-on makes aqt fail to parse the package XML -
          # which kills the whole step before a single line is compiled.
          modules: 'qtwebsockets qtmultimedia'

      - name: Build
        run: |
          # ⚠️ THE VERSION COMES FROM THE TAG. Without this the client falls back
          # to 0.0.0 and the .deb / Mac bundle carry a version that has nothing to
          # do with the release - which is exactly how v0.1.29 shipped a package
          # called hamdeck-client_0.1.15.
          VER="${GITHUB_REF_NAME#v}"
          case "$VER" in [0-9]*.[0-9]*.[0-9]*) ;; *) VER="0.0.0" ;; esac
          echo "building client version $VER"
          cmake -S client -B client/build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
                -DHAMDECK_VERSION="$VER"
          cmake --build client/build

      - name: Run the binary
        run: |
          # ⚠️ THE BINARY IS INSIDE AN .app ON macOS, UNDER THE DISPLAY NAME. The bundle
          # is "HamDeck Remote.app" and the executable inside carries the same name, not
          # the CMake target name - so every path here has a SPACE in it and must stay
          # quoted. An unquoted one splits into "client/build/HamDeck" and reports "no
          # such file", which reads as a build that produced nothing.
          BIN="client/build/HamDeck Remote.app/Contents/MacOS/HamDeck Remote"
          # ⚠️ NO FALLBACK TO A BARE client/build/hamdeck-qml. There used to be one, and
          # it would now hide the thing most likely to break: if OUTPUT_NAME stops
          # applying, the bundle is called hamdeck-qml.app again and a fallback would
          # quietly build, test and ship the badly-named app that this rename exists to
          # prevent. On APPLE the output is always a bundle, so a miss is a real fault.
          [ -f "$BIN" ] || { echo "no binary at $BIN - the bundle is not named as expected"; ls client/build; exit 1; }
          QT_QPA_PLATFORM=offscreen "$BIN" --selftest

      # ⚠️ ASK THE BINARY, NOT THE FLAG. CMAKE_OSX_ARCHITECTURES is a request, and if Qt
      # on this runner is single-architecture the link quietly produces a thin binary
      # anyway. A thin arm64 build looks perfect on an arm64 runner and fails on the one
      # Intel Mac somebody still owns - the sort of thing found by a user, not by CI.
      - name: It is actually universal
        run: |
          set -euo pipefail
          # ⚠️ THE BINARY IS INSIDE AN .app ON macOS, UNDER THE DISPLAY NAME. The bundle
          # is "HamDeck Remote.app" and the executable inside carries the same name, not
          # the CMake target name - so every path here has a SPACE in it and must stay
          # quoted. An unquoted one splits into "client/build/HamDeck" and reports "no
          # such file", which reads as a build that produced nothing.
          BIN="client/build/HamDeck Remote.app/Contents/MacOS/HamDeck Remote"
          # ⚠️ NO FALLBACK TO A BARE client/build/hamdeck-qml. There used to be one, and
          # it would now hide the thing most likely to break: if OUTPUT_NAME stops
          # applying, the bundle is called hamdeck-qml.app again and a fallback would
          # quietly build, test and ship the badly-named app that this rename exists to
          # prevent. On APPLE the output is always a bundle, so a miss is a real fault.
          [ -f "$BIN" ] || { echo "no binary at $BIN - the bundle is not named as expected"; ls client/build; exit 1; }
          echo "architectures: $(lipo -archs "$BIN")"
          lipo -archs "$BIN" | grep -q arm64  || { echo "missing arm64";  exit 1; }
          lipo -archs "$BIN" | grep -q x86_64 || { echo "missing x86_64"; exit 1; }

      # ⚠️ A BUILD IS NOT A BUNDLE. Everything above proves the binary is universal and
      # runs; none of it looks at what macOS actually shows the operator. 0.1.29 passed
      # every one of those checks and shipped an app Finder called "hamdeck-qml" with the
      # blank generic icon, plus no microphone usage string - which SIGKILLs the app on
      # the first PTT. This is the check that was missing.
      - name: Is it a properly formed Mac application
        run: python3 tools/check_macos_bundle.py "client/build/HamDeck Remote.app"

      # ⚠️ A TEMPORARY KEYCHAIN, not the login keychain. The runner is shared
      # infrastructure; importing a signing identity into the default keychain leaves it
      # for whatever runs next. This one is created, used, and destroyed with the job.
      - name: Import the signing identity
        if: ${{ env.APPLE_CERT_P12 != '' }}
        env:
          P12: ${{ secrets.APPLE_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a GUI prompt that nothing can answer and the
          # job hangs until it times out rather than failing.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "identity available:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Store the notarisation credentials
        if: ${{ env.APPLE_CERT_P12 != '' }}
        env:
          KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          echo "$KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc.p8"
          # ⚠️ The TEAM key. Apple's own docs: individual keys cannot use notaryTool.
          xcrun notarytool store-credentials hamdeck-notary \
            --key "$RUNNER_TEMP/asc.p8" --key-id "$KEY_ID" --issuer "$ISSUER" \
            --keychain "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/asc.p8"

      # ⚠️ NO VELOPACK ON macOS, DELIBERATELY.
      #
      # vpk builds its own .app from a directory of loose binaries, which fights the bundle
      # CMake already produced - the staging copy kept reaching for
      # client/build/hamdeck-qml, a path that does not exist when the output is an .app.
      # Velopack's value here is auto-update, and the macOS update source is not wired at
      # all yet, so the layer was costing correctness and buying nothing.
      #
      # This is plain Apple tooling end to end: macdeployqt, codesign, notarytool, stapler.
      - name: Deploy Qt into the bundle and sign it
        if: ${{ env.APPLE_CERT_P12 != '' }}
        run: |
          set -euo pipefail
          APP="client/build/HamDeck Remote.app"
          [ -d "$APP" ] || { echo "no .app was built at $APP"; exit 1; }
          macdeployqt "$APP" -qmldir=client/qml
          # ⚠️ --deep signs the frameworks macdeployqt just copied in. Signing only the
          # outer bundle leaves them unsigned, and notarisation rejects the whole thing
          # for a nested binary rather than for the app itself.
          codesign --force --deep --options runtime --timestamp \
                   --entitlements client/packaging/entitlements.plist \
                   --sign "Developer ID Application: henry Wussler (V829EBE8HH)" \
                   --keychain "$KEYCHAIN" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"

      # ⚠️ AND AGAIN ON THE SIGNED BUNDLE. macdeployqt rewrites the bundle after the
      # first check ran - it copies frameworks in and edits Info.plist - so the thing
      # verified above is not the thing that goes into the DMG.
      - name: Still a properly formed Mac application after macdeployqt
        if: ${{ env.APPLE_CERT_P12 != '' }}
        run: python3 tools/check_macos_bundle.py "$APP"

      # ⚠️ A DMG WITH AN APPLICATIONS ALIAS - the idiomatic macOS install, and safer than a
      # zip in practice: an unzipped .app tends to get run from Downloads, where quarantine
      # behaves differently and the app is one cleanup away from vanishing. A DMG steers
      # people to install it properly.
      #
      # Velopack does not build DMGs - it produces the .app and a .pkg, and a signed .pkg
      # would need a second Developer ID INSTALLER certificate against Apple's cap of 5.
      # So this wraps vpk's already-signed .app rather than replacing it.
      # ⚠️ THE DMG AND THE WINDOWS INSTALLER CARRY NO VERSION IN THEIR NAMES, so
      # the publish job's filename check is blind to both. The bundle's own
      # Info.plist is the only place the Mac build states what version it is -
      # and it is what Finder's Get Info shows the operator.
      - name: The bundle says it is the version being released
        if: ${{ env.APPLE_CERT_P12 != '' }}
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          case "$VER" in [0-9]*.[0-9]*.[0-9]*) ;; *) VER="0.0.0" ;; esac
          PLIST="$APP/Contents/Info.plist"
          got="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          echo "  CFBundleShortVersionString=$got  (release $VER)"
          [ "$got" = "$VER" ] || { echo "  the app would tell Get Info it is $got"; exit 1; }

      - name: Build a DMG
        if: ${{ env.APPLE_CERT_P12 != '' }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/dmg"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          # The alias is what makes drag-to-install obvious without a background image or
          # the .DS_Store fiddling that tends to break on a headless runner.
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "HamDeck Remote" -srcfolder "$STAGE" \
                         -ov -format UDZO "$RUNNER_TEMP/HamDeckRemote-macOS.dmg"
          echo "DMG=$RUNNER_TEMP/HamDeckRemote-macOS.dmg" >> "$GITHUB_ENV"

      # ⚠️ THE DMG ITSELF MUST BE SIGNED, NOTARISED AND STAPLED, not just the app inside.
      # A stapled app in an unstapled DMG still makes Gatekeeper phone home on first open,
      # which fails on a machine that is offline - the exact case a downloaded disk image
      # is most likely to hit.
      - name: Sign, notarise and staple the DMG
        if: ${{ env.APPLE_CERT_P12 != '' }}
        run: |
          set -euo pipefail
          codesign --sign "Developer ID Application: henry Wussler (V829EBE8HH)" \
                   --timestamp --keychain "$KEYCHAIN" "$DMG"
          xcrun notarytool submit "$DMG" --keychain-profile hamdeck-notary \
                --keychain "$KEYCHAIN" --wait
          xcrun stapler staple "$DMG"
          echo "== verifying the DMG itself =="
          spctl --assess --type open --context context:primary-signature -v "$DMG"
          xcrun stapler validate "$DMG"

      # ⚠️ MUST TARGET THE SAME REPO THE PUBLISH JOB USED. This job runs after publish and
      # attaches to an existing release; aiming it at the private repo while the release
      # lives in the public one produces a macOS build that succeeds and lands where
      # nobody can see it.
      - name: Attach it to the release
        if: ${{ env.APPLE_CERT_P12 != '' }}
        env:
          # ⚠️ TWO TOKENS, NOT ONE FALLING BACK TO THE OTHER. This used to be
          # `RELEASES_TOKEN || github.token`, which was fine while there was one
          # destination. Now there are two, and they need DIFFERENT credentials:
          # the fine-grained PAT is scoped to jwussler/hamdeck-releases and cannot
          # write here, while github.token cannot write there. One variable
          # holding whichever happened to exist would fail on one of the two.
          GH_TOKEN: ${{ github.token }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          # ⚠️ BOTH REPOS, same reason as the publish job: public is the canonical
          # download, the source repo is where its own author looks. This job runs
          # AFTER publish, so both releases already exist and this is an upload.
          #
          # ⚠️ The DMG is the ONE asset published by a different job from the rest,
          # so it is the one that can go missing without the publish job's count
          # gate noticing. Each upload is read back.
          has_dmg() {   # repo, token
            GH_TOKEN="$2" gh release view "${GITHUB_REF_NAME}" --repo "$1" \
              --json assets -q '.assets[].name' | grep -q '\.dmg$' \
              || { echo "no .dmg on the release in $1 after uploading it"; return 1; }
            echo "  $1: dmg present"
          }

          gh release upload "${GITHUB_REF_NAME}" "$DMG" --repo "$GITHUB_REPOSITORY" --clobber
          has_dmg "$GITHUB_REPOSITORY" "$GH_TOKEN"

          if [ -n "${RELEASES_TOKEN:-}" ]; then
            GH_TOKEN="$RELEASES_TOKEN" gh release upload "${GITHUB_REF_NAME}" "$DMG" \
              --repo jwussler/hamdeck-releases --clobber
            has_dmg jwussler/hamdeck-releases "$RELEASES_TOKEN"
          fi

      - name: Destroy the keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" 2>/dev/null || true

  # ⚠️ WITHOUT THIS THERE IS NO PERMANENT DOWNLOAD. Actions artifacts expire in
  # 90 days and are reachable only by someone logged in who can find the right
  # run - which is why every "here is the installer" link had to be dug out of a
  # workflow run by hand. A Release gives /releases/latest, and it does not expire.
  #
  # ⚠️ needs linux+windows ONLY. The macos job sits queued for hours on this
  # runner pool; gating the release on it would mean never publishing at all.
  publish:
    # ⚠️ pusher-windows is in `needs` so a broken pusher build BLOCKS the release rather
    # than publishing a set of artifacts with one quietly missing. The guard below only
    # checks that SOME .exe exists, which a missing pusher installer would still satisfy.
    needs: [linux, windows, pusher-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -e
          find dist -type f | sort
          # ⚠️ Refuse to publish without an installer. An empty release is worse
          # than none: it looks like the build shipped when nothing did.
          # ⚠️ *Setup.exe, not *.exe. The client's staged tree is among the artifacts now,
          # so a bare *.exe glob uploads hamdeck-qml.exe as a loose file - an executable
          # that cannot run without the Qt DLLs beside it, published next to the real
          # installer where somebody will reasonably try it.
          test -n "$(find dist -name '*Setup.exe' -print -quit)" || {
            echo "no installer among the artifacts - refusing to publish"; exit 1; }
          cat > notes.md <<'NOTES'
          ## Windows — download `HamDeck-win-Setup.exe`

          **One installer, both applications.** It installs the **HamDeck Remote** client and
          the **Wavelog Pusher** together, and updates them together. There is no separate
          client download on Windows and none is needed - this is it.

          Only want the radio panel? **`HamDeckRemote-win-Setup.exe`** installs the client
          on its own - no Wavelog pusher, and no auto-update.

          Mac: **`HamDeckRemote-macOS.dmg`**. Linux: the **`.deb`** for your architecture. The `.nupkg`,
          `RELEASES` and `releases.win.json` beside it are the update manifest — leave them
          there, they are what future versions install themselves from.

          Everything inside is code-signed and timestamped: the installer, the pusher, and
          the client.

          ### Windows will warn you. Here is exactly what to do.

          You will see **"Windows protected your PC"**. Click **More info** → **Run anyway**.

          **Check the Publisher line first. It must say `Henry Wussler`.** The installer is
          code-signed through Microsoft's Artifact Signing service, so Windows can tell you
          who built it. If it says Unknown or another name, stop — that file is not this one.

          **Why the warning happens:** SmartScreen asks "have I seen this file before?", not
          "is this safe?". New releases from small publishers always start at no. It clears
          as people install it. Microsoft removed the certificate-based bypass in 2024, so
          there is no way to skip that queue.

          ### What it does
          - Publishes your rig's frequency and mode to **Wavelog**, so the log follows the radio
          - **Stands down** while a remote client is operating the station
          - Serves the HamDeck REST API on `localhost:5001` so **Stream Deck buttons work**

          Settings live in `%APPDATA%\HamDeckPusher` and updates never touch them.

          ### Known gaps
          CW keyer, voice memories and RX antenna are not implemented on the C++ host yet.
          Those buttons say so plainly rather than failing silently.
          NOTES
          # ⚠️ UPLOAD THE VELOPACK FILES, NOT JUST THE .exe.
          #
          # The updater reads releases.win.json / RELEASES and downloads the .nupkg from the
          # SAME release. Publishing only Setup.exe produces a release that installs fine and
          # can never update anything - and nothing about it looks wrong until an update is
          # expected and silently does not arrive.
          # ⚠️ PUBLISH TO THE PUBLIC RELEASES REPO, NOT THIS ONE.
          #
          # This repository is private, so a release here is reachable by exactly one
          # person - and Velopack's updater cannot read it either, because GithubSource
          # needs an access token and embedding one puts a credential in every copy handed
          # to a friend, where it can be read straight back out.
          #
          # jwussler/hamdeck-releases is public and holds no source, so nothing has to be
          # audited for station detail before it can be seen.
          #
          # Falls back to publishing here when RELEASES_TOKEN is absent, so a build before
          # the token exists still produces a release rather than failing - and says which
          # it did, because silently publishing somewhere nobody is looking is worse than
          # an error.
          FILES="$(find dist -name '*Setup.exe') $(find dist -name '*.dmg') $(find dist -name '*.deb') $(find dist -name '*.nupkg') $(find dist -name 'RELEASES') $(find dist -name 'releases.*.json')"

          # ⚠️ A RELEASE WITH NO FILES IS THE FAILURE THIS STEP KEEPS PRODUCING.
          # 16 releases on this repo carried these exact notes - "download
          # HamDeckPusher-win-Setup.exe" - with ZERO assets attached, telling the
          # reader to download a file that was not there. Nothing failed: `gh
          # release create` is perfectly happy to publish a release with an empty
          # file list, and the job goes green. So the count is checked, twice:
          # here before publishing, and again against what the API actually holds
          # afterwards.
          EXPECTED=0
          for f in $FILES; do EXPECTED=$((EXPECTED+1)); done
          if [ "$EXPECTED" -eq 0 ]; then
            echo "no artifacts were found in dist/ - refusing to publish an empty release"
            find dist -type f | head -50
            exit 1
          fi
          echo "publishing $EXPECTED files"

          # ⚠️ EVERY ARTIFACT MUST CARRY THE RELEASE'S VERSION. v0.1.29 shipped
          # hamdeck-client_0.1.15_amd64.deb - built from the right commit, named
          # from a literal in CMakeLists that nobody had touched in fourteen
          # releases. It looked stale and nothing checked. Filenames are the
          # cheapest possible place to catch it.
          VER="${GITHUB_REF_NAME#v}"
          for f in $FILES; do
            case "$(basename "$f")" in
              *.deb|*.nupkg)
                case "$(basename "$f")" in
                  *"$VER"*) ;;
                  *) echo "$(basename "$f") does not carry the release version $VER"; exit 1 ;;
                esac ;;
            esac
          done
          echo "  every versioned artifact carries $VER"

          # ⚠️ EVERY PLATFORM SHIPS AN INSTALLER. Nobody using this project is going
          # to unzip a folder, find an exe among 1,369 files and make their own
          # shortcut - so a release that offers one is a release that offers nothing.
          # This refuses to publish unless each platform has something to double-click.
          need() {  # description, glob
            for f in $FILES; do
              case "$(basename "$f")" in $2) echo "  ✓ $1: $(basename "$f")"; return 0;; esac
            done
            echo "  ✗ MISSING $1 - the release page would offer no installer for it"
            return 1
          }
          need "Windows (client + pusher)" 'HamDeck-win-Setup.exe'
          need "Windows (client alone)"    'HamDeckRemote-win-Setup.exe'
          need "Linux"                     '*.deb'
          # ⚠️ macOS IS NOT CHECKED HERE, AND THAT IS NOT AN OVERSIGHT. The macos
          # job runs AFTER this one by design - its runner pool queues for hours,
          # so the release is published first and the DMG is attached when it
          # arrives. Demanding a .dmg at publish time asks for a file that cannot
          # exist yet: the first run of this gate failed on exactly that, and the
          # failure then SKIPPED the macos job, so the .dmg never got built at all.
          # The macos job verifies its own upload instead - see has_dmg there.

          # ⚠️ And nothing ships as a bare archive. The only non-installers allowed
          # are the three Velopack update-feed files, which the updater fetches from
          # this release - they are named explicitly so a new stray file is refused
          # rather than quietly joining them.
          for f in $FILES; do
            case "$(basename "$f")" in
              *.zip|*.tar.gz|*.7z)
                echo "  ✗ $(basename "$f") is an archive, not an installer"; exit 1 ;;
              *Setup.exe|*.dmg|*.deb|*.nupkg|RELEASES|releases.*.json) ;;
              *) echo "  ✗ $(basename "$f") is neither an installer nor a known update-feed file"; exit 1 ;;
            esac
          done

          # create-or-upload: a re-run of the same tag must top up the existing
          # release rather than fail on "already exists" and leave it half filled.
          publish() {   # repo, token
            GH_TOKEN="$2" gh release create "${GITHUB_REF_NAME}" --repo "$1" \
              --title "HamDeck ${GITHUB_REF_NAME}" --notes-file notes.md $FILES \
            || GH_TOKEN="$2" gh release upload "${GITHUB_REF_NAME}" --repo "$1" \
              $FILES --clobber
            local n
            n="$(GH_TOKEN="$2" gh release view "${GITHUB_REF_NAME}" --repo "$1" \
                  --json assets -q '.assets|length')"
            echo "  $1: $n assets"
            [ "$n" -ge "$EXPECTED" ] || { echo "  $1 has $n assets, expected $EXPECTED"; return 1; }
          }

          # ⚠️ BOTH REPOS, AND THE SOURCE REPO IS NOT OPTIONAL.
          #
          # jwussler/hamdeck-releases is the PUBLIC, canonical download: this repo
          # is private, so a release here is reachable by one person, and
          # Velopack's updater cannot read it at all - GithubSource needs a token,
          # and embedding one puts a credential in every copy handed to a friend
          # where it can be read straight back out.
          #
          # But the source repo is where its own author goes to find a build, and
          # for 16 tags what he found there was a page of instructions and a
          # Source code (zip) link. Mirroring costs an upload and removes a dead
          # end. Same files, same step, so the two cannot drift.
          if [ -n "${RELEASES_TOKEN:-}" ]; then
            echo "publishing to jwussler/hamdeck-releases (public, canonical)"
            publish jwussler/hamdeck-releases "$RELEASES_TOKEN"
            echo "mirroring to jwussler/hamdeck-cpp (private source repo)"
            publish "$GITHUB_REPOSITORY" "$GH_TOKEN"
          else
            # ⚠️ A TAG BUILD WITH NO RELEASES_TOKEN IS A FAILURE, NOT A FALLBACK.
            #
            # This used to publish quietly to the private repo and exit 0. v0.1.30
            # did exactly that: every installer built, signed and correct, attached
            # to a release that exactly one person on earth can open - and the job
            # went green. Meanwhile every installed copy points GithubSource at
            # jwussler/hamdeck-releases and would never have been offered the
            # update. Nothing looked wrong anywhere.
            #
            # The artifacts still get attached here first, so a token added later
            # only needs a re-run rather than a rebuild. Then it stops.
            echo "RELEASES_TOKEN is not set - attaching to this PRIVATE repo so the build is not wasted"
            publish "$GITHUB_REPOSITORY" "$GH_TOKEN"
            echo ""
            echo "REFUSING to call this a release. jwussler/hamdeck-releases is where"
            echo "downloads live and where every installed copy looks for updates."
            echo "Add a fine-grained PAT with contents:write on that repo as the"
            echo "RELEASES_TOKEN secret, then re-run this job."
            exit 1
          fi
