name: release

# Builds the client for each platform ON that platform.
#
# ⚠️ EVERY JOB RUNS THE BINARY BEFORE PACKAGING IT. A green build proves the code
# compiles and proves nothing about whether the program starts - the .NET client
# shipped a release that could not launch at all while every test passed
# (CARRYOVER.md section 8). `--selftest` walks the startup path and exits, and it
# runs under a timeout because a hang is a failure too.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build \
            qt6-base-dev qt6-declarative-dev qt6-websockets-dev qt6-multimedia-dev \
            qml6-module-qtqml qml6-module-qtqml-workerscript \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-templates \
            qml6-module-qtquick-window qml6-module-qtquick-shapes \
            libasound2-dev libssl-dev
      - name: Build
        run: |
          cmake -S client -B client/build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build client/build
      - name: Test
        run: ctest --test-dir client/build --output-on-failure
      - name: Run the binary
        run: QT_QPA_PLATFORM=offscreen timeout 60 ./client/build/hamdeck-qml --selftest
      - name: Package
        run: cd client/build && cpack -G DEB
      # ⚠️ Verify the ARTIFACT, not the build: install the package and run what
      # it installed, from the path it installed to.
      - name: Install the package and run what it installed
        run: |
          sudo apt-get install -y -qq ./client/build/*.deb
          QT_QPA_PLATFORM=offscreen timeout 60 /usr/bin/hamdeck-qml --selftest
      # ⚠️ A RELEASE GATE, ADDED BECAUSE 0.1.2 SHIPPED A WINDOW NOBODY COULD
      # MOVE. Every check before it ran under the offscreen QPA - no window
      # manager, no decoration - so a title bar placed above the top of the
      # screen could not be seen. This runs a real WM and reads back where the
      # decorated frame landed. If it fails, no installer is produced.
      - name: Where does the window actually land
        run: |
          sudo apt-get install -y -qq xvfb openbox x11-utils xdotool
          export HAMDECK_CLIENT=/usr/bin/hamdeck-qml
          for s in 1024x600 1366x768 1920x1080 2560x1440; do
            ./tools/placement_check.sh $s fresh || exit 1
          done
          ./tools/placement_check.sh 1920x1080 saved-at-origin || exit 1
          ./tools/placement_check.sh 1920x1080 saved-offscreen || exit 1
          ./tools/placement_check.sh 1024x600  saved-at-origin || exit 1
      - uses: actions/upload-artifact@v4
        with: { name: hamdeck-linux-deb, path: client/build/*.deb }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          # ⚠️ NOT qtdeclarative. Qt Quick is part of the BASE install in Qt 6,
          # and naming it as an add-on makes aqt fail to parse the package XML -
          # which kills the whole step before a single line is compiled.
          modules: 'qtwebsockets qtmultimedia'
      - name: Build
        run: |
          cmake -S client -B client/build -DCMAKE_BUILD_TYPE=Release
          cmake --build client/build --config Release
      - name: Run the binary
        shell: pwsh
        run: |
          # ⚠️ On Windows this is the check that matters: a Qt app missing its
          # platform plugin exits silently with no window and no message.
          $p = Start-Process -FilePath "client\build\Release\hamdeck-qml.exe" `
               -ArgumentList "--selftest" -NoNewWindow -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "selftest failed: $($p.ExitCode)" }
      # ⚠️ A GREEN WINDOWS BUILD DOES NOT MEAN THE ICON IS IN THE BINARY.
      # CMake ignores a .rc silently when the RC language is not enabled, so
      # 0.1.12 shipped with the resource committed, referenced, and never once
      # compiled. This looks inside the exe for the artwork itself.
      - name: The icon is actually in the exe
        run: python tools/check_exe_icon.py client\build\Release\hamdeck-qml.exe packaging\icons\hamdeck-256.png
        shell: cmd

      - name: Stage the Qt runtime beside the binary
        shell: pwsh
        run: |
          mkdir packaging\deploy
          copy client\build\Release\hamdeck-qml.exe packaging\deploy\
          # windeployqt pulls in the platform plugin, the QML modules and the
          # Qt DLLs. Without --qmldir it misses the QML imports entirely and the
          # app launches to a blank window.
          windeployqt --qmldir client\qml --release packaging\deploy\hamdeck-qml.exe
      - name: Run it again from the staged directory
        shell: pwsh
        run: |
          # Proves the DEPLOYED tree works, not just the build tree - which is
          # where the platform-plugin failure actually shows up.
          $p = Start-Process -FilePath "packaging\deploy\hamdeck-qml.exe" `
               -ArgumentList "--selftest" -NoNewWindow -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "deployed selftest failed: $($p.ExitCode)" }
      - name: Installer
        run: iscc packaging\hamdeck.iss
        shell: cmd
      - uses: actions/upload-artifact@v4
        with: { name: hamdeck-windows-installer, path: packaging/Output/*.exe }

  macos:
    # ⚠️ NOT VERIFIED BY ANYONE. Nobody in this project has a Mac to run the
    # result on, and CARRYOVER.md section 8 is about shipping a binary nobody
    # started. This job exists to catch PORTABILITY breaks in the source, not to
    # produce an artifact anybody should install - so it does not block a
    # release, and it uploads nothing.
    #
    # macos-13 rather than macos-latest: the arm64 runner's SDK has dropped the
    # AGL framework that this Qt build still links against, which fails at the
    # link step for environment reasons rather than anything in the code.
    continue-on-error: true
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          # ⚠️ NOT qtdeclarative. Qt Quick is part of the BASE install in Qt 6,
          # and naming it as an add-on makes aqt fail to parse the package XML -
          # which kills the whole step before a single line is compiled.
          modules: 'qtwebsockets qtmultimedia'
      - name: Build
        run: |
          cmake -S client -B client/build -DCMAKE_BUILD_TYPE=Release
          cmake --build client/build
      - name: Run the binary
        run: |
          QT_QPA_PLATFORM=offscreen ./client/build/hamdeck-qml --selftest
      # Deliberately no upload: see the note on this job. An artifact nobody has
      # run is worse than no artifact, because somebody will install it.

  # ⚠️ WITHOUT THIS THERE IS NO PERMANENT DOWNLOAD. Actions artifacts expire in
  # 90 days and are reachable only by someone logged in who can find the right
  # run - which is why every "here is the installer" link had to be dug out of a
  # workflow run by hand. A Release gives /releases/latest, and it does not expire.
  #
  # ⚠️ needs linux+windows ONLY. The macos job sits queued for hours on this
  # runner pool; gating the release on it would mean never publishing at all.
  publish:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          find dist -type f | sort
          # ⚠️ Refuse to publish without an installer. An empty release is worse
          # than none: it looks like the build shipped when nothing did.
          test -n "$(find dist -name '*.exe' -print -quit)" || {
            echo "no installer among the artifacts - refusing to publish"; exit 1; }
          cat > notes.md <<'NOTES'
          Windows installer and Linux `.deb`.

          **The Windows installer is unsigned**, so SmartScreen warns on first run:
          *More info* then *Run anyway*.

          Every CI job runs the binary before packaging it, the panel placement is
          checked at seven screen sizes, and the application icon is verified to be
          embedded in the executable.
          NOTES
          gh release create "${GITHUB_REF_NAME}" \
            --title "HamDeck ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            $(find dist -name '*.exe') $(find dist -name '*.deb')
