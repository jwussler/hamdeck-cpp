name: ios

# ⚠️ THIS WORKFLOW IS THE ONLY PLACE THE iOS BUILD CAN BE TESTED. There is no Mac
# in this project's development loop, so an iOS change that is not run here has
# not been run at all - and "it compiles" has already shipped a client that could
# not launch once in this repo's history.
#
# ⚠️ IT BUILDS FOR THE DEVICE, UNSIGNED, AND IT DOES NOT RUN THE APP.
# BE CLEAR ABOUT WHAT THAT IS WORTH: it proves the client COMPILES AND LINKS for
# iOS. It does NOT prove the app starts. That is a real gap and it is stated here
# rather than papered over - a static Qt build missing its QML plugin imports
# links perfectly and dies at launch with "module QtQuick is not installed", and
# nothing in this job would catch it.
#
# The simulator build, which COULD have run the app, does not link. Qt's iOS
# package ships the permission plugins' _init objects as device slices only:
#
#   ld: building for 'iOS-simulator', but linking in object file
#       (.../plugins/permissions/.../QDarwinMicrophonePermissionPlugin_init.cpp.o)
#       built for 'iOS'
#
# qt_import_plugins(EXCLUDE_BY_TYPE permissions) does not remove them - they
# arrive through QtMultimedia's own link interface. Until that is solved, the
# first proof that this app RUNS comes from a real phone or a Mac. docs/IOS.md.

on:
  push:
    branches: [ main, 'ios**', 'phone**' ]
    paths:
      - 'client/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign the build (needs the Apple secrets)"
        type: boolean
        default: false
      upload:
        description: "⚠️ UPLOAD to TestFlight. This is DISTRIBUTION - see docs/IOS.md on static-Qt LGPL."
        type: boolean
        default: false

jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # ⚠️ TWO Qt INSTALLS, AND BOTH ARE REQUIRED. Cross-compiling for a phone
      # still runs moc, rcc, qmlcachegen and the QML type registrar ON THE
      # RUNNER, and those come from the HOST Qt. With only the iOS package the
      # configure step fails deep inside Qt's own cmake with a message about a
      # missing tool rather than about a missing host install.
      - name: Qt (host tools)
        uses: jurplel/install-qt-action@v4
        with:
          # Same 6.9.2 as the macOS job. 6.8.1 cannot link against the Xcode 26
          # SDK (`ld: framework 'AGL' not found`), measured on that job.
          version: '6.9.2'
          host: 'mac'
          target: 'desktop'
          modules: 'qtwebsockets qtmultimedia'
          set-env: false
          dir: ${{ runner.temp }}/qt-host

      - name: Qt (iOS)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.2'
          host: 'mac'
          target: 'ios'
          # ⚠️ NOT qtdeclarative. Qt Quick is part of the BASE install in Qt 6 and
          # naming it as an add-on makes aqt fail to parse the package XML, which
          # kills the step before anything is compiled. Same trap as the mac job.
          modules: 'qtwebsockets qtmultimedia'
          dir: ${{ runner.temp }}/qt-ios

      - name: Configure
        run: |
          set -eux
          HOST_QT=$(echo ${{ runner.temp }}/qt-host/Qt/6.9.2/macos)
          IOS_QT=$(echo ${{ runner.temp }}/qt-ios/Qt/6.9.2/ios)
          test -d "$HOST_QT" || { echo "no host Qt at $HOST_QT"; ls -R ${{ runner.temp }}/qt-host | head -40; exit 1; }
          test -d "$IOS_QT"  || { echo "no iOS Qt at $IOS_QT";  ls -R ${{ runner.temp }}/qt-ios  | head -40; exit 1; }
          # ⚠️ iphoneos, and NOT signed. Signing needs an App ID and a
          # provisioning profile that do not exist yet (docs/IOS.md), and none of
          # that is needed to answer the question this job asks: does the client
          # compile and link for a phone.
          cmake -S client -B client/build-ios -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE="$IOS_QT/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="$HOST_QT" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DHAMDECK_VERSION="0.0.0"

      # ⚠️ WHAT Qt ACTUALLY SHIPPED, printed before the build rather than guessed
      # at afterwards. The plugin target names are what qt_import_plugins has to
      # match, and getting one wrong fails at link with a symbol wall that names
      # the plugin's contents and never the plugin.
      - name: What plugins does this Qt have
        run: |
          IOS_QT=${{ runner.temp }}/qt-ios/Qt/6.9.2/ios
          echo "── multimedia:";  ls "$IOS_QT/plugins/multimedia"  2>/dev/null || echo "  (none)"
          echo "── permissions:"; ls "$IOS_QT/plugins/permissions" 2>/dev/null || echo "  (none)"

      - name: Build
        run: cmake --build client/build-ios --config Release -- -quiet

      - name: Find the bundle
        id: app
        run: |
          set -eux
          APP=$(find client/build-ios -name 'hamdeck-qml.app' -maxdepth 4 | head -1)
          # ⚠️ A missing bundle must FAIL here. Left to the install step it
          # surfaces as a simctl error about a path, which reads like a simulator
          # problem rather than a build that produced nothing.
          test -n "$APP" || { echo "no .app was built"; find client/build-ios -name '*.app'; exit 1; }
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          /usr/libexec/PlistBuddy -c Print "$APP/Info.plist" | head -40

      # ⚠️ THE PLIST IS CHECKED, because it is the half of an iOS bundle that
      # fails silently. A missing NSMicrophoneUsageDescription does not warn: iOS
      # SIGKILLs the process the moment it asks for the mic, which on a transmit
      # app means the panel vanishes when the operator keys up.
      - name: The bundle says what it must
        run: |
          set -eux
          APP="${{ steps.app.outputs.app }}"
          P="$APP/Info.plist"
          for KEY in NSMicrophoneUsageDescription UIBackgroundModes UILaunchScreen \
                     CFBundleIdentifier CFBundleExecutable MinimumOSVersion; do
            /usr/libexec/PlistBuddy -c "Print :$KEY" "$P" >/dev/null \
              || { echo "MISSING from Info.plist: $KEY"; exit 1; }
          done
          # audio, specifically - the key existing but empty would pass the loop
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$P" | grep -q audio \
            || { echo "UIBackgroundModes does not contain 'audio'"; exit 1; }
          echo "Info.plist carries every key the app depends on"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-device-build
          path: |
            client/build-ios/Release-iphoneos/*.app
          if-no-files-found: warn

  # ── Signed build, and optionally the upload ─────────────────────────────────
  # ⚠️ A SEPARATE JOB, ONLY ON workflow_dispatch, AND IT NEVER SKIPS QUIETLY.
  # If it is asked to sign and a secret is missing it FAILS. A signing job that
  # silently produced an unsigned artifact would be indistinguishable from a
  # working one until the upload rejected it, hours later, with an error about
  # entitlements.
  #
  # ⚠️ SIGNING IS NOT DISTRIBUTION; UPLOADING IS. Producing the .ipa is safe to
  # do at any time. The upload is the moment the static-Qt LGPL obligation binds
  # (docs/IOS.md), which is why it is a separate opt-in and defaults to false.
  signed:
    if: github.event_name == 'workflow_dispatch' && inputs.sign
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to pretend
        env:
          P12:     ${{ secrets.APPLE_IOS_DIST_P12 }}
          P12PW:   ${{ secrets.APPLE_IOS_DIST_P12_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_IOS_PROFILE }}
        run: |
          for v in P12 P12PW PROFILE; do
            eval "val=\$$v"
            [ -n "$val" ] || { echo "MISSING SECRET: APPLE_IOS_$v - refusing to build something that only looks signed"; exit 1; }
          done
          echo "signing material present"

      - uses: jurplel/install-qt-action@v4
        with: { version: '6.9.2', host: 'mac', target: 'desktop', modules: 'qtwebsockets qtmultimedia', set-env: false, dir: '${{ runner.temp }}/qt-host' }
      - uses: jurplel/install-qt-action@v4
        with: { version: '6.9.2', host: 'mac', target: 'ios', modules: 'qtwebsockets qtmultimedia', dir: '${{ runner.temp }}/qt-ios' }

      # ⚠️ A THROWAWAY KEYCHAIN, unlocked, with the partition list set. Without
      # set-key-partition-list codesign blocks on a GUI prompt that nothing on a
      # runner can answer, and the job hangs until it is cancelled - which reads
      # as a slow build, not a failure.
      - name: Import the signing identity
        env:
          P12:   ${{ secrets.APPLE_IOS_DIST_P12 }}
          P12PW: ${{ secrets.APPLE_IOS_DIST_P12_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_IOS_PROFILE }}
        run: |
          set -eu
          KC="$RUNNER_TEMP/hamdeck.keychain-db"
          KCPW=$(uuidgen)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$P12" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$P12PW" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # ⚠️ Read the identity back rather than hardcoding its name. The CN is
          # "iPhone Distribution: ..." on this cert and "Apple Distribution: ..."
          # on newer ones, and guessing wrong fails deep inside xcodebuild.
          security find-identity -v -p codesigning "$KC"
          IDENT=$(security find-identity -v -p codesigning "$KC" | grep -o '"[^"]*"' | head -1 | tr -d '"')
          [ -n "$IDENT" ] || { echo "no codesigning identity in the keychain"; exit 1; }
          echo "IDENT=$IDENT" >> "$GITHUB_ENV"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/HamDeck.mobileprovision"

      - name: Archive
        run: |
          set -eux
          HOST_QT=${{ runner.temp }}/qt-host/Qt/6.9.2/macos
          IOS_QT=${{ runner.temp }}/qt-ios/Qt/6.9.2/ios
          VER="0.1.0"
          cmake -S client -B client/build-ios -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE="$IOS_QT/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="$HOST_QT" \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DHAMDECK_VERSION="$VER" \
            -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM=V829EBE8HH \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_STYLE=Manual \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="$IDENT" \
            -DCMAKE_XCODE_ATTRIBUTE_PROVISIONING_PROFILE_SPECIFIER="HamDeck iOS App Store"
          xcodebuild -project client/build-ios/hamdeck-client.xcodeproj \
            -scheme hamdeck-qml -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HamDeck.xcarchive" archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/HamDeck.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist client/packaging/ios/ExportOptions.plist
          ls -la "$RUNNER_TEMP/export"

      # ⚠️ VERIFY THE SIGNATURE ON THE ARTIFACT, not on the intention. An
      # unsigned or wrongly-signed .ipa is accepted by every step up to the
      # upload, which rejects it with an entitlements error naming nothing.
      - name: The .ipa is actually signed
        run: |
          set -eu
          IPA=$(ls "$RUNNER_TEMP/export"/*.ipa | head -1)
          [ -n "$IPA" ] || { echo "no .ipa was exported"; exit 1; }
          cd "$RUNNER_TEMP" && rm -rf verify && mkdir verify && cd verify && unzip -q "$IPA"
          APP=$(ls -d Payload/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvvv "$APP" 2>&1 | grep -E 'Authority|TeamIdentifier|Identifier'
          # ⚠️ THE ICON IS CHECKED HERE, because the only other place that looks
          # at it is Apple's upload - after a 6-minute build. A missing catalog
          # is rejected with 90713/90022/90023 and nothing local ever noticed.
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$APP/Info.plist"
          ls "$APP"/AppIcon*.png >/dev/null 2>&1 \
            || { echo "no AppIcon PNGs in the bundle - the asset catalog did not compile"; ls "$APP" | head -30; exit 1; }
          echo "icons present: $(ls "$APP"/AppIcon*.png | wc -l) sizes"
          echo "IPA=$IPA" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with: { name: hamdeck-ios-ipa, path: '${{ runner.temp }}/export/*.ipa' }

      # ⚠️ THE DISTRIBUTION STEP. Opt-in, separate, and last.
      - name: Upload to TestFlight
        if: inputs.upload
        env:
          ASC_KEY_P8:    ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID:    ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -eu
          [ -n "$ASC_KEY_P8" ] || { echo "MISSING SECRET: ASC_KEY_P8"; exit 1; }
          # altool looks for the key HERE, by this exact filename, and says
          # "could not find the API key" rather than naming the path it wanted.
          mkdir -p "$HOME/private_keys"
          echo "$ASC_KEY_P8" | base64 -d > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "uploaded - TestFlight processing takes a few minutes before it appears"
