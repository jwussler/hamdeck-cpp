name: build

# ⚠️ A GREEN BUILD PROVES THE CODE COMPILES. IT DOES NOT PROVE THE PROGRAM STARTS.
# The .NET client shipped a release that could not launch at all while every test
# passed, because CI built the artifact and never ran it. So this workflow runs
# the binary, and treats a hang as a failure.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build libssl-dev libasound2-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # The step that matters. `timeout` makes a hang fail rather than run until
      # the job is cancelled - a selftest that blocks forever looks exactly like
      # one that is still working.
      - name: Run the binary (--selftest)
        run: timeout 60 ./build/hamdeck-host --selftest

      # An unknown flag must abort, not be ignored. Silently accepting a
      # misspelled flag is how a safety option gets quietly disabled.
      - name: Unknown flags are refused
        run: |
          if ./build/hamdeck-host --not-a-real-flag; then
            echo "FAIL: unknown flag was accepted"; exit 1
          fi
          echo "ok: unknown flag rejected"

  pusher:
    # ⚠️ Runs on every push, not only on a tag. The .NET client's whole five-release
    # evening happened because 49 tests existed and CI never called them.
    #
    # Linux, deliberately: this catches logic and import breaks on every commit and costs
    # seconds. The FROZEN bundle can only be proven on Windows, and that runs in
    # release.yml - a green run here says the code is right, never that the installer is.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: tkinter, for the window selftest
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Tests
        working-directory: pusher
        run: python -m unittest discover -s tests -v
      - name: Selftest, including the real window
        working-directory: pusher
        run: xvfb-run -a python -m hamdeck_pusher --selftest

  macos-universal:
    # ⚠️ A FAST FEEDBACK LOOP FOR THE ONE ASSUMPTION THE MAC RELEASE RESTS ON.
    #
    # The release job builds a universal binary, which only works if the Qt kit aqt
    # downloads is itself universal. Qt's documentation covers building Qt universal from
    # source; it does not say the prebuilt macOS kit is fat, and that is the thing being
    # relied on. Finding out from a release run means burning a tag per attempt.
    #
    # This runs on every push and answers it in minutes. No signing, no notarisation - it
    # exists to answer one question.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # ⚠️ NEWER QT THAN THE OTHER PLATFORMS, ON PURPOSE AND UNDER TEST.
      #
      # Qt 6.8.1 fails to link on this runner: `ld: framework 'AGL' not found`. AGL is
      # Apple's long-removed OpenGL framework, and Qt's Gui dependency asks CMake for it;
      # the Xcode 26 SDK on macos-latest does not have it. Qt 6.8.1 predates that SDK.
      #
      # ⚠️ This is the AGL problem the old macos-13 comment described. I dismissed it as
      # unverified because the comment was written against an already-retired runner - the
      # provenance was bad, the claim was true. Being unable to check something is not
      # evidence it is false.
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.2'
          modules: 'qtwebsockets qtmultimedia'
      - name: Is the Qt kit itself universal
        run: |
          # ⚠️ Ask before building. If Qt is thin, the app link fails with an error about
          # missing symbols for x86_64, which reads as a code problem and is not one.
          #
          # ⚠️ The framework BINARY, not whatever `find -name QtCore` hits first - the
          # first match was QtCore.framework.dSYM/.../DWARF/QtCore, a debug file, and
          # lipo on it says nothing about the library that gets linked. A check that
          # reports confidently about the wrong file is worse than no check.
          LIB="$QT_ROOT_DIR/lib/QtCore.framework/Versions/A/QtCore"
          [ -f "$LIB" ] || LIB="$QT_ROOT_DIR/lib/QtCore.framework/QtCore"
          echo "QtCore: $LIB"
          [ -f "$LIB" ] && lipo -archs "$LIB" || echo "  (QtCore framework binary not found)"
      - name: Build universal
        run: |
          cmake -S client -B client/build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build client/build
      - name: It is actually universal
        run: |
          set -euo pipefail
          # ⚠️ THE BINARY IS INSIDE AN .app ON macOS. qt_add_executable produces a bundle,
          # so client/build/hamdeck-qml does not exist - the tools report "no such file",
          # which reads as a build that produced nothing rather than a path that is wrong.
          BIN=client/build/hamdeck-qml.app/Contents/MacOS/hamdeck-qml
          [ -f "$BIN" ] || BIN=client/build/hamdeck-qml
          echo "architectures: $(lipo -archs "$BIN")"
          lipo -archs "$BIN" | grep -q arm64  || { echo "missing arm64";  exit 1; }
          lipo -archs "$BIN" | grep -q x86_64 || { echo "missing x86_64"; exit 1; }
      - name: Run it
        run: |
          # ⚠️ THE BINARY IS INSIDE AN .app ON macOS. qt_add_executable produces a bundle,
          # so client/build/hamdeck-qml does not exist - the tools report "no such file",
          # which reads as a build that produced nothing rather than a path that is wrong.
          BIN=client/build/hamdeck-qml.app/Contents/MacOS/hamdeck-qml
          [ -f "$BIN" ] || BIN=client/build/hamdeck-qml
          QT_QPA_PLATFORM=offscreen "$BIN" --selftest
