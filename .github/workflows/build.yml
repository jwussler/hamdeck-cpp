name: build

# ⚠️ A GREEN BUILD PROVES THE CODE COMPILES. IT DOES NOT PROVE THE PROGRAM STARTS.
# The .NET client shipped a release that could not launch at all while every test
# passed, because CI built the artifact and never ran it. So this workflow runs
# the binary, and treats a hang as a failure.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build libssl-dev libasound2-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # The step that matters. `timeout` makes a hang fail rather than run until
      # the job is cancelled - a selftest that blocks forever looks exactly like
      # one that is still working.
      - name: Run the binary (--selftest)
        run: timeout 60 ./build/hamdeck-host --selftest

      # An unknown flag must abort, not be ignored. Silently accepting a
      # misspelled flag is how a safety option gets quietly disabled.
      - name: Unknown flags are refused
        run: |
          if ./build/hamdeck-host --not-a-real-flag; then
            echo "FAIL: unknown flag was accepted"; exit 1
          fi
          echo "ok: unknown flag rejected"

  pusher:
    # ⚠️ Runs on every push, not only on a tag. The .NET client's whole five-release
    # evening happened because 49 tests existed and CI never called them.
    #
    # Linux, deliberately: this catches logic and import breaks on every commit and costs
    # seconds. The FROZEN bundle can only be proven on Windows, and that runs in
    # release.yml - a green run here says the code is right, never that the installer is.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: tkinter, for the window selftest
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Tests
        working-directory: pusher
        run: python -m unittest discover -s tests -v
      - name: Selftest, including the real window
        working-directory: pusher
        run: xvfb-run -a python -m hamdeck_pusher --selftest
