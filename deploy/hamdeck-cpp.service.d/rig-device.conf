# Tie the host to the radio, not to the boot order.
#
# 09/02/2026: the CAT cable was moved. The host kept running with a DEAD fd
# (/proc/<pid>/fd/3 -> /dev/ttyUSB0 (deleted)) and reported rig_connected:false
# forever — it opens the port once at startup and has no reconnect path. So the
# recovery has to come from outside the process: stop it when the radio leaves,
# start it when the radio comes back.
[Unit]
# BindsTo, not Requires: BindsTo also STOPS this unit when the device vanishes,
# which is what drops the stale fd. 99-hamdeck-radio.rules sets SYSTEMD_WANTS on
# the same device, so plugging the radio back in starts the host again.
BindsTo=dev-ttyRIG.device
After=dev-ttyRIG.device

[Service]
# Keep trying forever while the radio is away or the codec has not enumerated
# yet. The host exits 1 on a missing CAT port or capture device by design, and
# StartLimit would otherwise let systemd give up on it.
Restart=always
RestartSec=5
StartLimitIntervalSec=0
